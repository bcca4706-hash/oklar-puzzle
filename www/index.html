<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141426">
<meta name="description" content="Renkli okların düğümünü çöz! Yolu açık oku bul, sırayla temizle.">
<title>OKLAR — Düğüm Bulmacası</title>
<style>
  :root{--bg:#141426;--bg2:#1D1D36;--line:#F5F1E6;--dim:#565678;--amber:#FFB347;--red:#E2554F}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--bg2) 0%,var(--bg) 62%) fixed,var(--bg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--line)}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  #hud{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 8px}
  /* --- neon panel (gorseldeki cerceveli kapsuller) --- */
  .pan{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
    background:linear-gradient(180deg,rgba(40,52,92,.92),rgba(16,20,42,.92));
    border:1px solid rgba(120,190,255,.32);
    box-shadow:0 0 12px rgba(60,140,255,.22),inset 0 1px 0 rgba(180,220,255,.18)}
  #lvl{font-size:11px;font-weight:800;letter-spacing:.2em;color:#9FC4E8}
  #lvl b{color:#FFD34D;font-size:17px;letter-spacing:.04em;margin-left:6px;
    text-shadow:0 0 10px rgba(255,200,60,.6)}
  #timer{font-size:15px;font-weight:800;letter-spacing:.03em;color:#EAF4FF;min-width:52px;
    text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(120,200,255,.5)}
  #timer.low{color:var(--red);animation:tPulse .5s ease infinite}
  @keyframes tPulse{0%,100%{opacity:1}50%{opacity:.45}}
  #hearts{display:flex;gap:5px}
  .heart{width:11px;height:11px;border-radius:50% 50% 0 0/60% 60% 0 0;position:relative;
    background:#FF4D5E;transform:rotate(-45deg);transition:opacity .3s,transform .3s;
    filter:drop-shadow(0 0 4px rgba(255,70,90,.85))}
  .heart::after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;
    background:#FF4D5E;top:-5.5px;left:0}
  .heart::before{content:"";position:absolute;width:11px;height:11px;border-radius:50%;
    background:#FF4D5E;top:0;left:5.5px}
  .heart.off{opacity:.16;transform:rotate(-45deg) scale(.75);filter:none}
  /* --- yuvarlak neon ikon butonlar (gorseldeki daire butonlar) --- */
  .rnd{position:relative;width:42px;height:42px;border-radius:50%;font-size:18px;line-height:1;
    background:radial-gradient(circle at 50% 32%,rgba(60,90,150,.95),rgba(14,18,38,.95));
    border:1px solid rgba(120,190,255,.42);color:#EAF4FF;
    box-shadow:0 0 12px rgba(60,140,255,.28),inset 0 1px 0 rgba(180,220,255,.22);
    display:flex;align-items:center;justify-content:center;transition:transform .12s}
  .rnd:active{transform:scale(.9)}
  .rnd .bdg{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 4px;
    border-radius:999px;background:#2FBF5B;color:#fff;font-size:11px;font-weight:900;
    display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.5);
    box-shadow:0 0 8px rgba(50,220,120,.6)}
  .rnd .bdg.amb{background:#F5A623;box-shadow:0 0 8px rgba(245,166,35,.6)}
  .rnd .lbl{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);
    font-size:9px;font-weight:800;letter-spacing:.08em;color:#9FC4E8;white-space:nowrap}
  #coin{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:900;color:#FFD34D;
    text-shadow:0 0 8px rgba(255,200,60,.55)}
  html.light{--bg:#F7F5F0;--bg2:#FFFFFF;--line:#1B1B1B;--dim:#A29C8E}
  html.light .ov{background:rgba(247,245,240,.95)}
  html.light #progWrap{background:#E4DFD2}
  html.light .big{color:#F7F5F0}
  html.light .big.ghost{color:#1B1B1B}
  html.light .pan{background:linear-gradient(180deg,#fff,#EFEBE0);border-color:#D8D3C5;box-shadow:none}
  html.light .rnd{background:#fff;border-color:#D8D3C5;color:#1B1B1B;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  html.light #lvl{color:#8A8477}html.light #lvl b{color:#1B1B1B;text-shadow:none}
  html.light #timer{color:#1B1B1B;text-shadow:none}
  html.light .rnd .lbl{color:#8A8477}
  #cv{flex:1;width:100%;touch-action:none}
  #foot{display:flex;justify-content:center;align-items:center;gap:26px;
    padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 22px)}
  .btn{background:var(--bg2);border:1px solid var(--dim);color:var(--line);
    border-radius:12px;padding:12px 22px;font-size:14px;font-weight:700;letter-spacing:.08em}
  .btn:active{transform:scale(.96)}
  .btn[disabled]{opacity:.35}
  .rnd[disabled]{opacity:.4}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(20,20,38,.94);z-index:10;text-align:center;
    padding:30px;transition:opacity .25s}
  .ov.hide{opacity:0;pointer-events:none}
  .logo{font-size:52px;font-weight:900;letter-spacing:.3em;margin-left:.3em}
  .logo .c1{color:#FF5D5D}.logo .c2{color:#FFB347}.logo .c3{color:#5FD68A}
  .logo .c4{color:#4FC3F7}.logo .c5{color:#C77DFF}
  .sub{margin-top:10px;font-size:13px;letter-spacing:.22em;color:var(--dim);font-weight:700}
  .big{margin-top:34px;background:var(--amber);color:var(--bg);border:none;border-radius:14px;
    padding:16px 44px;font-size:16px;font-weight:900;letter-spacing:.14em}
  .big:active{transform:scale(.96)}
  .ovMsg{font-size:26px;font-weight:900;letter-spacing:.18em}
  #progWrap{height:4px;margin:0 18px;border-radius:2px;background:#26263F;overflow:hidden}
  #progFill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#F4A261,#FFB347);
    transition:width .25s ease}
  .stars{font-size:46px;letter-spacing:.18em;margin-left:.18em;color:#33334F;margin-bottom:6px}
  .stars span{display:inline-block;transition:transform .3s cubic-bezier(.34,1.56,.64,1),color .3s}
  .stars .on{color:var(--amber);text-shadow:0 0 20px rgba(255,179,71,.55);transform:scale(1.15)}
  .big.alt{background:#5FD68A}
  .big.ghost{background:transparent;border:1px solid var(--dim);color:var(--line)}
  @keyframes hFlash{0%{filter:none}30%{filter:drop-shadow(0 0 8px #E2554F) brightness(1.6)}100%{filter:none}}
  #hearts.flash .heart{animation:hFlash .4s ease}
  .ovSmall{margin-top:8px;color:var(--dim);font-size:13px;font-weight:700;letter-spacing:.12em}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="pan"><div id="lvl"><span id="lvlLbl">SEVİYE</span><b id="lvlNum">1</b></div></div>
    <div class="pan"><span style="font-size:13px">⏱</span><div id="timer"><span id="timerVal">1:10</span></div></div>
    <div class="pan"><div id="hearts"><div class="heart"></div><div class="heart"></div><div class="heart"></div><div class="heart"></div><div class="heart"></div></div></div>
    <div class="pan"><div id="coin"><span style="font-size:13px">🪙</span><span id="coinVal">0</span></div></div>
  </div>
  <div id="progWrap"><div id="progFill"></div></div>
  <canvas id="cv"></canvas>
  <div id="foot">
    <button class="rnd" id="hintBtn">💡<span class="bdg" id="hintBdg">3</span><span class="lbl">İPUCU</span></button>
    <button class="rnd" id="zoomBtn">🔍<span class="bdg amb" id="zoomBdg">2×</span><span class="lbl">YAKINLAŞTIR</span></button>
    <button class="rnd" id="resetBtn">↺<span class="lbl">BAŞTAN</span></button>
    <button class="rnd" id="pauseBtn">⏸<span class="lbl">DURAKLAT</span></button>
    <button class="rnd" id="thmBtn">◐<span class="lbl">TEMA</span></button>
    <button class="rnd" id="sndBtn">♪<span class="lbl">SES</span></button>
  </div>
</div>

<div class="ov" id="startOv">
  <div class="logo"><span class="c1">O</span><span class="c2">K</span><span class="c3">L</span><span class="c4">A</span><span class="c5">R</span></div>
  <div class="sub" id="subT">DÜĞÜMÜ ÇÖZ</div>
  <button class="big" id="playBtn">OYNA</button>
  <div class="ovSmall" id="contInfo"></div>
  <div class="ovSmall" id="streakInfo" style="color:#FFB347;margin-top:4px"></div>
</div>

<div class="ov hide" id="failOv">
  <div class="ovMsg" id="failT" style="color:var(--red)">KALPLER BİTTİ</div>
  <div class="ovSmall" id="failS">Kafası açık yolda olan oku bul, sırayla çöz</div>
  <button class="big alt" id="reviveBtn">📺 İZLE, +2 KALP</button>
  <button class="big ghost" id="retryBtn">TEKRAR DENE</button>
</div>

<div class="ov hide" id="winOv">
  <div class="stars"><span id="st1">★</span><span id="st2">★</span><span id="st3">★</span></div>
  <div class="ovMsg" id="winT" style="color:var(--amber)">SEVİYE TAMAM</div>
  <div class="ovSmall" id="winStats"></div>
  <button class="big" id="nextBtn">DEVAM →</button>
</div>

<div class="ov hide" id="pauseOv">
  <div class="ovMsg" id="pauseT" style="color:var(--amber)">DURAKLATILDI</div>
  <button class="big" id="resumeBtn">DEVAM ET</button>
</div>

<script>

const $=id=>document.getElementById(id);
const LANG=((navigator.language||"tr").toLowerCase().startsWith("tr"))?"tr":"en";
const TXD={
 tr:{level:"SEVİYE",sub:"DÜĞÜMÜ ÇÖZ",play:"OYNA",failT:"KALPLER BİTTİ",

  score:"SKOR",time:"SÜRE",total:"TOPLAM",sn:"sn",contL:"Seviye",contS:"Toplam Skor",streak:"gün seri 🔥",dailyBonus:"Günlük bonus: +2 ipucu! 🎁",

 en:{level:"LEVEL",sub:"UNTANGLE THE KNOT",play:"PLAY",failT:"OUT OF HEARTS",
  failS:"Find an arrow with a clear path, solve in order",revive:"📺 WATCH, +2 HEARTS",

  pauseT:"PAUSED",resume:"RESUME"}
};
const TX=TXD[LANG];
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const PALETTE=["#FF6B6B","#F4A261","#E9C46A","#8AC926","#2A9D8F","#4CC9F0","#4895EF","#7B7FEE","#B388EB","#F72585","#FF8FA3","#70E4C7"];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;}}
const easeOut=t=>1-Math.pow(1-t,3);
const easeInQ=t=>t*t;
const key=(x,y)=>x+","+y;
// Sureyi 1:05 gibi dakika:saniye formatinda goster
function fmtTime(s){s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),ss=s%60;return m+":"+(ss<10?"0"+ss:ss);}

/* ---- kayıt ---- */
let mem={level:1,sound:1,total:0,hints:3};
try{const s=localStorage.getItem("oklar2");if(s)mem=JSON.parse(s);}catch(e){}
if(mem.hints===undefined)mem.hints=3;
if(mem.theme===undefined)mem.theme="ancient";
if(mem.coins===undefined)mem.coins=0;
if(mem.haptic===undefined)mem.haptic=1;
const THEMES={
  ancient:{name:"ANCIENT CORE",bg:"#1A1206",bg2:"#2B1E0A",dot:"#2E2411",outline:"#1A1206",text:"#FFE9B8",mono:null,
    pal:["#FFC64D","#FFB020","#E8A317","#FFD97A","#D98E1F","#FFE29B","#C8871A","#FFCE60","#EAB040","#B8791A"]},
  void_:{name:"VOID",bg:"#0B0618",bg2:"#170C2B",dot:"#1D1235",outline:"#0B0618",text:"#EBDBFF",mono:null,
    pal:["#C77DFF","#9D4EDD","#E0AAFF","#7B2CBF","#D896FF","#B15EFF","#8A3FFD","#CBA0FF","#A44DFF","#DDB4FF"]},
  frozen:{name:"FROZEN CORE",bg:"#04141F",bg2:"#082433",dot:"#0D2C3D",outline:"#04141F",text:"#DFF6FF",mono:null,
    pal:["#5FD8FF","#00B4E0","#8AE6FF","#2E9FD4","#B0EEFF","#48C8F5","#0E86B8","#7ADFFF","#35B6E8","#A5E9FF"]},
  magma:{name:"MAGMA",bg:"#1C0704",bg2:"#2E0F07",dot:"#3A160B",outline:"#1C0704",text:"#FFDCC7",mono:null,
    pal:["#FF6B20","#FF8B3D","#FF4E11","#FFA45C","#E03A0A","#FF7A2E","#FFB877","#D6300A","#FF9448","#FF5C18"]},
  bio:{name:"BIO CORE",bg:"#04160D",bg2:"#082616",dot:"#0D2E1B",outline:"#04160D",text:"#D6FFE6",mono:null,
    pal:["#4DFF9E","#00E07A","#8AFFC0","#22C46A","#B0FFD6","#3DEF8E","#0FA85C","#6FFFB2","#2ED97F","#9BFFCB"]},
  cyber:{name:"CYBER CITY",bg:"#0A0618",bg2:"#150C2B",dot:"#1C1236",outline:"#0A0618",text:"#F0E4FF",mono:null,
    pal:["#FF2E97","#00E5FF","#C77DFF","#FF6BC5","#4DD9FF","#FF3DAF","#8A5CFF","#FFA0DC","#2EC4FF","#E05CFF"]},
  thunder:{name:"THUNDER",bg:"#060B1A",bg2:"#0C142E",dot:"#111B3A",outline:"#060B1A",text:"#E4EFFF",mono:null,
    pal:["#6FA8FF","#3D7BFF","#A8C8FF","#2E5FE0","#C4DCFF","#5490FF","#1E48C4","#89B6FF","#3F6FF0","#B0CEFF"]},
  temple:{name:"LOST TEMPLE",bg:"#191204",bg2:"#2A1F09",dot:"#332710",outline:"#191204",text:"#FFEDC4",mono:null,
    pal:["#F5C542","#E0A81E","#FFD873","#C89018","#FFE49B","#DEB43A","#A87512","#FFCE5C","#D4A32E","#FFDF8A"]},
  abyss:{name:"ABYSS",bg:"#03121A",bg2:"#062230",dot:"#0A2A3A",outline:"#03121A",text:"#D4F5F0",mono:null,
    pal:["#2EE6C8","#00C4A8","#6FF5DE","#149E88","#A0FFEF","#3DD9BE","#0B7A6A","#5FEBD4","#22B8A0","#8AFFE8"]},
  cosmic:{name:"COSMIC",bg:"#0A0620",bg2:"#150C35",dot:"#1B1242",outline:"#0A0620",text:"#EFE0FF",mono:null,
    pal:["#B15EFF","#FF6BC5","#5FD8FF","#E0AAFF","#FF9ED8","#8A5CFF","#7AE0FF","#D68AFF","#FF7ACB","#A0C8FF"]},
  steam:{name:"STEAM FORGE",bg:"#170F06",bg2:"#261B0C",dot:"#2F2211",outline:"#170F06",text:"#FFE6C4",mono:null,
    pal:["#E8A05C","#C87A38","#FFC38A","#A85E24","#FFD6AB","#D68F4A","#8A4A18","#F0AE6E","#BE7030","#FFCE9B"]},
  dark:{name:"DARK REALM",bg:"#0C0714",bg2:"#170D26",dot:"#1E1230",outline:"#0C0714",text:"#E6D6F5",mono:null,
    pal:["#9D6BFF","#6B3FBF","#C4A0FF","#4F2E96","#D8BFFF","#8250E8","#3D2178","#B08AFF","#6E42CC","#C9AEFF"]},
  crystal:{name:"CRYSTAL CAVE",bg:"#070A1C",bg2:"#0D1230",dot:"#131A3C",outline:"#070A1C",text:"#DFEAFF",mono:null,
    pal:["#7AB8FF","#B58AFF","#5FD8FF","#8A9EFF","#D0B0FF","#4F9EF0","#9B78F5","#A8D4FF","#6E7FE8","#C4A8FF"]},
  metro:{name:"NEON METROPOLIS",bg:"#080614",bg2:"#120C26",dot:"#191230",outline:"#080614",text:"#F0E8FF",mono:null,
    pal:["#FF3D7F","#00E5C4","#FFD24D","#B15EFF","#3DD9FF","#FF6B4D","#8AFF5C","#FF5CC4","#5CB0FF","#FFA02E"]},
  solar:{name:"SOLAR CORE",bg:"#1A0F02",bg2:"#2C1B05",dot:"#36230A",outline:"#1A0F02",text:"#FFEECB",mono:null,
    pal:["#FFB020","#FF8A1F","#FFD060","#E06A0F","#FFE099","#FF9E2E","#C85408","#FFC44D","#F07E18","#FFD880"]}
};
const THEME_ORDER=["ancient","void_","frozen","magma","bio","cyber","thunder","temple","abyss","cosmic","steam","dark","crystal","metro","solar"];
if(!THEMES[mem.theme])mem.theme="ancient";   // eski kayitlar icin guvenli gecis
let T=THEMES[mem.theme];
const colName=s=>T.mono||s.color;

const save=()=>{try{localStorage.setItem("oklar2",JSON.stringify(mem));}catch(e){}};

/* ---- ses ---- */
let AC=null;
function beep(f,dur,type="sine",vol=.18,slide=0){
  if(!mem.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+dur);
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}
const NOTES=[392,440,523,587,659,784,880,1046]; // pentatonik merdiven
function pluck(f,vol=.16){
  if(!mem.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();
    o.type="triangle";o.frequency.value=f;
    o2.type="sine";o2.frequency.value=f/2;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.28);
    o.connect(g);o2.connect(g);g.connect(AC.destination);
    o.start(t);o2.start(t);o.stop(t+.3);o2.stop(t+.3);
  }catch(e){}
}
const CHORDS=[[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7],[164.8,196,246.9]];
let chordIdx=0;
function padChord(){
  if(!mem.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime,fr=CHORDS[chordIdx%CHORDS.length];chordIdx++;
    for(const f of fr){
      const o=AC.createOscillator(),g=AC.createGain();
      o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.028,t+1.4);
      g.gain.linearRampToValueAtTime(0,t+4.4);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+4.5);
    }
  }catch(e){}
}
function startMusic(){if(musicInt)return;padChord();musicInt=setInterval(padChord,4200);}
function stopMusic(){clearInterval(musicInt);musicInt=null;}
const sfx={
  fly(){pluck(NOTES[Math.min(Math.max(combo-1,0),NOTES.length-1)]);
    if(navigator.vibrate)navigator.vibrate(12)},
  bump(){beep(150,.18,"square",.12,70);if(navigator.vibrate)navigator.vibrate(70)},
  win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>pluck(f,.18),i*100));
    if(navigator.vibrate)navigator.vibrate([40,60,40])},
  fail(){beep(200,.3,"sawtooth",.1,90)},
  tick(){beep(700,.05,"sine",.08)}
};

/* ================= SEVİYE ÜRETİMİ =================
   Yılan-oklar ters sırayla yerleştirilir. Her yeni yılanın
   kafa ışını (çıkış yolu) o ana dek konan yılanların
   hücrelerine ve kendi gövdesine çarpmaz -> yerleştirmenin
   tersi sırayla oynanınca seviye HER ZAMAN çözülür.
   Sonradan konan gövdeler öncekilerin çıkışını kapatır:
   düğüm böyle oluşur. */
/* TAM DOLULUK ÜRETİMİ (7+ seviyeler):
   1) Tahta, kıvrımlı "solucan" yollarıyla ~%100 döşenir.
   2) Kenardan içe soyma: düz çıkış koridoru o an boşalmış olan her
      solucan sırayla soyulur, kafa/yön soyulma anına göre atanır.
   Soyma sırası = garantili çözüm. Soyulamayan nadir solucanlar
   elenir (küçük delikler) -> doluluk %90+ kalır. */
/* Orijinaldeki gibi organik tahta şekilleri: seviyeler dikdörtgen,
   elips, kalp, elmas ve blob arasında döner. */
// Ilk bolumler tek renk (ogretici), sonrasi rengarenk
const SOLO_COLORS=["#FFD93D","#FF5252","#4EC3F5","#5FD98A","#FF9E47","#C77DFF","#3DFFD9","#FF6B9D","#B8FF3B","#FF8A5C"]; // sari,kirmizi,mavi,yesil,turuncu,mor,turkuaz,pembe,yesilimsi,somon
function colorSnakes(snakes,n,rnd){
  // Renk ritmi (16 bolumluk dongu):
  //  1-6  : tek renk (her bolum farkli)
  //  7-10 : karisik (rengarenk)
  //  11-16: 2serli tek renk (11-12 ayni, 13-14 ayni, 15-16 ayni)
  //  sonra dongu bassa doner
  const c=((n-1)%16)+1; // 1..16 arası konum
  // Tek renk seviyelerde de AKTIF TEMANIN paleti kullanilir -> her dunya kendi atmosferini korur
  const SC=(T&&T.pal&&T.pal.length)?T.pal:SOLO_COLORS;
  let mode,soloColor=null;
  if(c<=6){ mode="solo"; soloColor=SC[(c-1)%SC.length]; }
  else if(c<=10){ mode="mix"; }
  else { mode="solo"; soloColor=SC[Math.floor((c-11)/2)%SC.length]; }

  if(mode==="solo"){
    snakes.forEach((s,i)=>{s.color=soloColor;s.delay=(i/snakes.length)*600+rnd()*40;});
  }else{
    const cshuf=[...(T.pal||PALETTE)].sort(()=>Math.random()-.5);
    snakes.forEach((s,i)=>{s.color=cshuf[i%cshuf.length];s.delay=(i/snakes.length)*600+rnd()*40;});
  }
}
function maskFor(n,cols,rows,rnd){
  const type=(n-7)%13;
  const f1=rnd()*6.28,f2=rnd()*6.28,rot=rnd()*6.28;
  // Parametrik varyasyon: her bolumde donme + hafif olcek/gerilme
  // Boylece 13 temel sekil yuzlerce farkli gorunume donusur
  const gRot=rnd()*6.28;                 // sekil dondurme acisi
  const sx=0.86+rnd()*0.28;              // yatay olcek (0.86-1.14)
  const sy=0.86+rnd()*0.28;              // dikey olcek
  const cosG=Math.cos(gRot),sinG=Math.sin(gRot);
  return (x,y)=>{
    let u0=(x+.5-cols/2)/(cols/2),v0=(y+.5-rows/2)/(rows/2);
    // olcekle + dondur
    u0/=sx; v0/=sy;
    const u=u0*cosG-v0*sinG, v=u0*sinG+v0*cosG;
    if(type===0)return Math.abs(u)<=1&&Math.abs(v)<=1; // dikdörtgen (dondurulur)
    if(type===1)return u*u+v*v<=1.02;                          // elips
    if(type===2){                                              // kalp
      const X=u*1.25,Y=-v*1.25+.25,q=X*X+Y*Y-1;
      return q*q*q-X*X*Y*Y*Y<=0;
    }
    if(type===3)return Math.abs(u)+Math.abs(v)<=1.12;          // elmas
    if(type===4){                                              // blob
      const r=Math.hypot(u,v),th=Math.atan2(v,u);
      return r<=.92+.16*Math.sin(3*th+f1)+.11*Math.sin(5*th+f2);
    }
    if(type===5){                                              // yıldız (5 uçlu)
      const r=Math.hypot(u,v),th=Math.atan2(v,u)+rot;
      const k=0.72+0.34*Math.abs(Math.cos(2.5*th));
      return r<=1.02/k*0.82;
    }
    if(type===6){                                              // altıgen
      const au=Math.abs(u),av=Math.abs(v);
      return (av<=0.92)&&(0.5*av+0.866*au<=0.92);
    }
    if(type===7){                                              // artı / haç
      return (Math.abs(u)<=0.42)||(Math.abs(v)<=0.42);
    }
    if(type===8){                                              // üçgen
      return (v<=0.82)&&(v>=-0.72)&&(Math.abs(u)<=(0.82-v)*0.62);
    }
    if(type===9){                                              // çiçek (6 yaprak)
      const r=Math.hypot(u,v),th=Math.atan2(v,u)+rot;
      return r<=.62+.34*Math.abs(Math.sin(3*th));
    }
    if(type===10){                                             // dişli / çark
      const r=Math.hypot(u,v),th=Math.atan2(v,u)+rot;
      return r<=.88+.12*Math.sign(Math.sin(8*th));
    }
    if(type===11){                                             // yıldız (6 uçlu)
      const r=Math.hypot(u,v),th=Math.atan2(v,u)+rot;
      const k=0.70+0.36*Math.abs(Math.cos(3*th));
      return r<=1.0/k*0.80;
    }
    // type===12 halka + orta (yuvarlak köşeli kare)
    const p=4;
    return Math.pow(Math.abs(u),p)+Math.pow(Math.abs(v),p)<=Math.pow(0.95,p);
  };
}
function packWorms(cols,rows,rnd,mask){
  const inB=(x,y)=>x>=0&&x<cols&&y>=0&&y<rows;
  const inM=(x,y)=>inB(x,y)&&(!mask||mask(x,y));
  const idxOf=(x,y)=>y*cols+x;
  const owner=new Array(cols*rows).fill(-1);
  const worms=[];
  const order=[...Array(cols*rows).keys()].filter(ci=>inM(ci%cols,Math.floor(ci/cols)));
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(rnd()*(i+1));[order[i],order[j]]=[order[j],order[i]];
  }
  const wLen=()=>{const r=rnd();
    if(r<.32)return 2+Math.floor(rnd()*2);
    if(r<.70)return 4+Math.floor(rnd()*3);
    return 7+Math.floor(rnd()*4);};
  for(const ci of order){
    if(owner[ci]!==-1)continue;
    const path=[[ci%cols,Math.floor(ci/cols)]];
    owner[ci]=worms.length;
    const target=wLen();
    while(path.length<target){
      const [lx,ly]=path[path.length-1];
      const opts=[];
      for(const d of [0,1,2,3]){
        const nx=lx+DIRS[d][0],ny=ly+DIRS[d][1];
        if(inM(nx,ny)&&owner[idxOf(nx,ny)]===-1)opts.push([nx,ny]);
      }
      if(!opts.length)break;
      let p;
      if(path.length>1&&rnd()<.45){
        const [px,py]=path[path.length-2];
        const sx=lx+(lx-px),sy=ly+(ly-py);
        p=opts.find(o=>o[0]===sx&&o[1]===sy)||opts[Math.floor(rnd()*opts.length)];
      }else p=opts[Math.floor(rnd()*opts.length)];
      owner[idxOf(p[0],p[1])]=worms.length;
      path.push(p);
    }
    worms.push({cells:path});
  }
  // tekli hücreleri komşu solucanın UCUNA kaynaştır
  for(const w of worms){
    if(w.cells.length>1||w.dead)continue;
    const [x,y]=w.cells[0];let ok=false;
    for(const d of [0,1,2,3]){
      const nx=x+DIRS[d][0],ny=y+DIRS[d][1];
      if(!inM(nx,ny))continue;
      const oi=owner[idxOf(nx,ny)];
      const o=worms[oi];
      if(!o||o.dead||o===w||o.cells.length>=10)continue;
      const h=o.cells[o.cells.length-1],t=o.cells[0];
      if(h[0]===nx&&h[1]===ny){o.cells.push([x,y]);owner[idxOf(x,y)]=oi;ok=true;break;}
      if(t[0]===nx&&t[1]===ny){o.cells.unshift([x,y]);owner[idxOf(x,y)]=oi;ok=true;break;}
    }
    w.dead=true;
    if(!ok)owner[idxOf(x,y)]=-1; // delik
  }
  const live=worms.filter(w=>!w.dead);
  // soyma
  const present=new Set();
  for(const w of live){w.peeled=false;for(const c of w.cells)present.add(key(c[0],c[1]));}
  function rayClear(x,y,dx,dy){
    let cx=x+dx,cy=y+dy;
    while(inB(cx,cy)){
      if(present.has(key(cx,cy)))return false;
      cx+=dx;cy+=dy;
    }
    return true;
  }
  const solved=[];
  function peelPass(){
    let any=false;
    for(const w of live){
      if(w.peeled)continue;
      const c=w.cells;
      const ends=[[c[c.length-1],c[c.length-2],false],[c[0],c[1],true]];
      for(const [head,prev,rev] of ends){
        const dx=head[0]-prev[0],dy=head[1]-prev[1];
        if(!rayClear(head[0],head[1],dx,dy))continue;
        if(rev)w.cells=[...c].reverse();
        w.dir=DIRS.findIndex(v=>v[0]===dx&&v[1]===dy);
        w.head=w.cells[w.cells.length-1];
        w.peeled=true;solved.push(w);
        for(const cc of w.cells)present.delete(key(cc[0],cc[1]));
        any=true;break;
      }
    }
    return any;
  }
  // tıkanınca: en uzun sıkışmış solucanı ikiye böl (yeni uçlar = yeni çıkışlar)
  let guardP=0;
  while(guardP++<2000){
    while(peelPass());
    const stuck=live.filter(w=>!w.peeled);
    if(!stuck.length)break;
    stuck.sort((a,b)=>b.cells.length-a.cells.length);
    const w=stuck[0];
    if(w.cells.length>=4){
      const cut=rnd()<.5?2:w.cells.length-2; // uçtan kes: uzun taraf hayatta kalsın
      const a={cells:w.cells.slice(0,cut),peeled:false};
      const b={cells:w.cells.slice(cut),peeled:false};
      live.splice(live.indexOf(w),1,a,b);
    }else{
      for(const cc of w.cells)present.delete(key(cc[0],cc[1])); // delik
      live.splice(live.indexOf(w),1);
    }
  }
  return solved; // soyma sırası = çözüm sırası
}
function genLevel(n){
  const rnd=mulberry32(n*2654435761+1299709);
  const RAMP=[[5,7,8],[7,10,14],[9,13,22],[11,17,35],[14,22,55],[17,28,80]];
  let cols,rows,nSnakes;
  if(n<=6){[cols,rows,nSnakes]=RAMP[n-1];}
  else{
    cols=20;rows=34;
    const mask=maskFor(n,cols,rows,rnd);
    let mcells=0;
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(mask(x,y))mcells++;
    let bestS=null,bestF=0;
    for(let t=0;t<4;t++){
      const S=packWorms(cols,rows,rnd,mask);
      const f=S.reduce((a,w)=>a+w.cells.length,0)/mcells;
      if(f>bestF){bestF=f;bestS=S;}
      if(f>=.93)break;
    }
    const snakes=bestS.map((w,i)=>({id:i,cells:w.cells,head:w.head,dir:w.dir,alive:true}));
    colorSnakes(snakes,n,rnd);
    return {cols,rows,snakes,mask};
  }
  // karışık uzunluk: çoğunluk kısa (2-3), orta (4-6), az sayıda uzun (7-10)
  function pickLen(){
    const r=rnd();
    if(r<.45)return 2+Math.floor(rnd()*2);      // 2-3
    if(r<.82)return 4+Math.floor(rnd()*3);      // 4-6
    return 7+Math.floor(rnd()*4);               // 7-10
  }
  const occ=new Map(); // "x,y" -> snake index
  const snakes=[];
  const inB=(x,y)=>x>=0&&x<cols&&y>=0&&y<rows;
  function rayFrom(x,y,d){ // kafadan kenara hücreler
    const out=[];let cx=x+DIRS[d][0],cy=y+DIRS[d][1];
    while(inB(cx,cy)){out.push([cx,cy]);cx+=DIRS[d][0];cy+=DIRS[d][1];}
    return out;
  }
  function allRays(){ // zincir yanlılığı için mevcut çıkış ışınları
    const s=new Set();
    for(const sn of snakes)for(const c of rayFrom(sn.head[0],sn.head[1],sn.dir))s.add(key(c[0],c[1]));
    return s;
  }
  let guard=0;
  while(snakes.length<nSnakes&&guard<100000){
    guard++;
    // merkez-önce yanlılığı: erken yerleştirmeler merkeze, geç olanlar kenara
    const prog=snakes.length/nSnakes;
    let hx,hy,bestScore=-1;
    for(let c=0;c<3;c++){
      const tx=Math.floor(rnd()*cols),ty=Math.floor(rnd()*rows);
      if(occ.has(key(tx,ty)))continue;
      const cen=1-((Math.abs(tx-(cols-1)/2)/cols)+(Math.abs(ty-(rows-1)/2)/rows));
      const sc=prog<.55?cen:(1-cen);
      if(sc>bestScore){bestScore=sc;hx=tx;hy=ty;}
    }
    if(bestScore<0)continue;
    const ds=[0,1,2,3].sort(()=>rnd()-.5);
    let dir=-1,ray=null;
    for(const d of ds){
      const r=rayFrom(hx,hy,d);
      if(r.every(c=>!occ.has(key(c[0],c[1])))){dir=d;ray=r;break;}
    }
    if(dir<0)continue;
    const rayset=new Set(ray.map(c=>key(c[0],c[1])));
    // gövde: kafadan geriye rastgele yürüyüş
    const body=[[hx,hy]];
    const bset=new Set([key(hx,hy)]);
    const px=hx-DIRS[dir][0],py=hy-DIRS[dir][1];
    if(!inB(px,py)||occ.has(key(px,py))||rayset.has(key(px,py)))continue;
    body.push([px,py]);bset.add(key(px,py));
    const rays=allRays();
    const len=guard>20000?2:pickLen();
    while(body.length<len){
      const [lx,ly]=body[body.length-1];
      const opts=[];
      for(const d of [0,1,2,3]){
        const nx=lx+DIRS[d][0],ny=ly+DIRS[d][1],k2=key(nx,ny);
        if(!inB(nx,ny)||occ.has(k2)||bset.has(k2)||rayset.has(k2))continue;
        opts.push([nx,ny,rays.has(k2)?1:0]);
      }
      if(!opts.length)break;
      // %65 zincir yanlılığı: başka yılanın çıkışını kapatan hücreyi seç
      const chain=opts.filter(o=>o[2]);
      const pick=(chain.length&&rnd()<.8)?chain[Math.floor(rnd()*chain.length)]
                                          :opts[Math.floor(rnd()*opts.length)];
      body.push([pick[0],pick[1]]);bset.add(key(pick[0],pick[1]));
    }
    if(body.length<2)continue;
    body.reverse(); // artık kuyruk->kafa sırası
    const idx=snakes.length;
    for(const c of body)occ.set(key(c[0],c[1]),idx);
    snakes.push({id:idx,cells:body,head:[hx,hy],dir,
      color:PALETTE[idx%PALETTE.length],alive:true});
  }
  // renkleri karıştır
  colorSnakes(snakes,n,rnd);
  return {cols,rows,snakes};
}

/* --- haptic: hafif/orta/guclu (destek yoksa sessizce gecer) --- */
function haptic(kind){
  if(mem.haptic===0)return;
  try{
    if(!navigator.vibrate)return;
    if(kind==="tap")navigator.vibrate(10);
    else if(kind==="ok")navigator.vibrate(22);
    else if(kind==="win")navigator.vibrate([0,35,60,55]);
    else if(kind==="err")navigator.vibrate([0,18,40,18]);
  }catch(e){}
}
const cv=$("cv");let ctx=cv.getContext("2d");
let DPR=1,cell=0,ox=0,oy=0,bgCv=null,stCv=null,stDirty=true;



/* ============ DUNYA ARKA PLAN GORSELLERI (gercek asset) ============
   Dosyalar: www/assets/bg/<tema>.jpg  (yoksa prosedurel sahne kullanilir)
   Bir kez yuklenir, bellekte tutulur; her karede maliyet yok.        */
const BGIMG={};           // key -> {img, ok}
function bgImageFor(key){
  let e=BGIMG[key];
  if(e)return e.ok?e.img:null;
  e=BGIMG[key]={img:new Image(),ok:false};
  e.img.onload=()=>{e.ok=true;layout();stDirty=true;};  // gelince yeniden ciz
  e.img.onerror=()=>{e.ok=false;};
  e.img.src="assets/bg/"+key+".jpg";
  return null;
}
/* Gorseli ekrani kaplayacak sekilde (cover) ciz */
function drawCover(b,img,W,H){
  const ir=img.width/img.height, cr=W/H;
  let dw,dh;
  if(ir>cr){dh=H;dw=H*ir;}else{dw=W;dh=W/ir;}
  b.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
}
/* ================= DUNYA ARKA PLANLARI (prosedurel, asset yok) =================
   Her tema kendi sahnesini bgCv'ye BIR KEZ cizer -> her karede maliyet yok.
   Deterministik: ayni tema hep ayni sahne (rastgele titremez).            */
function bgRand(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
function hexA(hex,al){
  const h=hex.replace("#","");
  const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return "rgba("+r+","+g+","+b+","+al+")";
}
function drawScene(b,W,H){
  const key=mem.theme, acc=(T.pal&&T.pal[0])||T.text, acc2=(T.pal&&T.pal[2])||acc;
  const R=bgRand(key.length*7919+W);
  b.save();
  // ortak: ust yumusak isik halesi (derinlik)
  const g=b.createRadialGradient(W*.5,H*.3,0,W*.5,H*.3,Math.max(W,H)*.75);
  g.addColorStop(0,hexA(acc,.10));g.addColorStop(1,"rgba(0,0,0,0)");
  b.fillStyle=g;b.fillRect(0,0,W,H);

  const stars=(n,mx)=>{for(let i=0;i<n;i++){const x=R()*W,y=R()*H,r=(.4+R()*mx)*DPR;
    b.globalAlpha=.10+R()*.35;b.fillStyle=R()<.3?acc2:"#FFFFFF";
    b.beginPath();b.arc(x,y,r,0,7);b.fill();}b.globalAlpha=1;};
  const spires=(cnt,minH,maxH,col,up)=>{for(let i=0;i<cnt;i++){
    const x=R()*W,w=(18+R()*46)*DPR,h=(minH+R()*(maxH-minH))*H;
    b.globalAlpha=.13+R()*.16;b.fillStyle=col;
    b.beginPath();
    if(up){b.moveTo(x,H);b.lineTo(x+w/2,H-h);b.lineTo(x+w,H);}
    else{b.moveTo(x,0);b.lineTo(x+w/2,h);b.lineTo(x+w,0);}
    b.closePath();b.fill();}b.globalAlpha=1;};
  const city=()=>{for(let i=0;i<26;i++){
    const w=(26+R()*54)*DPR,x=R()*W,h=(.12+R()*.32)*H;
    b.globalAlpha=.16;b.fillStyle="#000000";b.fillRect(x,H-h,w,h);
    b.globalAlpha=.30+R()*.35;b.fillStyle=R()<.5?acc:acc2;
    b.fillRect(x,H-h,w,2*DPR);                       // cati neon seridi
    for(let k=0;k<5;k++){const wy=H-h+(8+k*16)*DPR;   // pencere isiklari
      if(wy>H-6*DPR)break;b.globalAlpha=.10+R()*.25;
      b.fillRect(x+(4+R()*(w-10)),wy,3*DPR,3*DPR);}}b.globalAlpha=1;};
  const blobs=(n,col,mn,mx)=>{for(let i=0;i<n;i++){
    const x=R()*W,y=R()*H,r=(mn+R()*(mx-mn))*DPR;
    const gg=b.createRadialGradient(x,y,0,x,y,r);
    gg.addColorStop(0,hexA(col,.20));gg.addColorStop(1,"rgba(0,0,0,0)");
    b.fillStyle=gg;b.beginPath();b.arc(x,y,r,0,7);b.fill();}};
  const bolts=(n)=>{for(let i=0;i<n;i++){
    let x=R()*W,y=0;b.globalAlpha=.10+R()*.14;b.strokeStyle=acc;b.lineWidth=(1+R()*2)*DPR;
    b.beginPath();b.moveTo(x,y);
    while(y<H*(.4+R()*.5)){y+=(20+R()*40)*DPR;x+=(R()-.5)*70*DPR;b.lineTo(x,y);}
    b.stroke();}b.globalAlpha=1;};
  const gears=(n)=>{for(let i=0;i<n;i++){
    const x=R()*W,y=R()*H,rr=(30+R()*70)*DPR,teeth=8+Math.floor(R()*6);
    b.globalAlpha=.09;b.strokeStyle=acc;b.lineWidth=3*DPR;
    b.beginPath();b.arc(x,y,rr,0,7);b.stroke();
    b.beginPath();b.arc(x,y,rr*.55,0,7);b.stroke();
    for(let t=0;t<teeth;t++){const a=t/teeth*6.283;
      b.beginPath();b.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);
      b.lineTo(x+Math.cos(a)*rr*1.2,y+Math.sin(a)*rr*1.2);b.stroke();}}b.globalAlpha=1;};
  const rings=(n)=>{for(let i=0;i<n;i++){
    const x=R()*W,y=R()*H*.7,rr=(60+R()*150)*DPR;
    b.globalAlpha=.07+R()*.06;b.strokeStyle=R()<.5?acc:acc2;b.lineWidth=(2+R()*3)*DPR;
    b.save();b.translate(x,y);b.rotate(R()*3);b.scale(1,.32);
    b.beginPath();b.arc(0,0,rr,0,7);b.stroke();b.restore();}b.globalAlpha=1;};
  const columns=()=>{for(let i=0;i<7;i++){
    const x=(i/7)*W+R()*40*DPR,w=(22+R()*20)*DPR,h=(.3+R()*.45)*H;
    b.globalAlpha=.12;b.fillStyle=acc;
    b.fillRect(x,H-h,w,h);
    b.globalAlpha=.16;b.fillRect(x-4*DPR,H-h,w+8*DPR,10*DPR);}b.globalAlpha=1;};
  const bubbles=(n)=>{for(let i=0;i<n;i++){
    const x=R()*W,y=R()*H,rr=(4+R()*26)*DPR;
    b.globalAlpha=.06+R()*.10;b.strokeStyle=acc2;b.lineWidth=1.5*DPR;
    b.beginPath();b.arc(x,y,rr,0,7);b.stroke();}b.globalAlpha=1;};

  switch(key){
    case "ancient": columns(); stars(40,1.1); break;
    case "void_":   stars(150,1.6); blobs(4,acc,140,300); break;
    case "frozen":  spires(11,.18,.5,acc,true); spires(7,.12,.36,acc2,false); stars(50,1.1); break;
    case "magma":   blobs(7,acc,110,260); spires(8,.10,.34,acc,true); stars(26,1.0); break;
    case "bio":     blobs(9,acc2,70,190); bubbles(26); break;
    case "cyber":   city(); stars(40,1.0); break;
    case "thunder": bolts(7); stars(60,1.2); break;
    case "temple":  columns(); blobs(3,acc,150,280); stars(30,1.0); break;
    case "abyss":   bubbles(40); blobs(5,acc2,120,260); break;
    case "cosmic":  stars(130,1.5); rings(4); blobs(3,acc2,130,280); break;
    case "steam":   gears(6); blobs(3,acc,110,220); break;
    case "dark":    spires(9,.22,.55,"#000000",true); stars(70,1.2); blobs(3,acc,120,240); break;
    case "crystal": spires(13,.16,.48,acc,true); spires(9,.12,.34,acc2,false); stars(45,1.2); break;
    case "metro":   city(); bolts(3); stars(35,1.0); break;
    case "solar":   blobs(6,acc,150,320); rings(3); stars(45,1.3); break;
    default:        stars(60,1.2);
  }
  // alt karartma -> butonlar okunakli kalsin
  const gb=b.createLinearGradient(0,H*.72,0,H);
  gb.addColorStop(0,"rgba(0,0,0,0)");gb.addColorStop(1,hexA(T.bg,.85));
  b.fillStyle=gb;b.fillRect(0,H*.72,W,H*.28);
  b.restore();
}
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  const r=cv.getBoundingClientRect();
  cv.width=r.width*DPR;cv.height=r.height*DPR;
  if(!L)return;
  const pad=12*DPR;
  cell=Math.min((cv.width-pad*2)/L.cols,(cv.height-pad*2)/L.rows);
  ox=(cv.width-cell*L.cols)/2;oy=(cv.height-cell*L.rows)/2;
  bgCv=document.createElement("canvas");
  bgCv.width=cv.width;bgCv.height=cv.height;
  const b=bgCv.getContext("2d");
  try{
    const bi=bgImageFor(mem.theme);
    if(bi){
      drawCover(b,bi,bgCv.width,bgCv.height);
      // okunabilirlik: hafif karartma + alt gradyan
      b.fillStyle=hexA(T.bg,.42);b.fillRect(0,0,bgCv.width,bgCv.height);
      const gb=b.createLinearGradient(0,bgCv.height*.68,0,bgCv.height);
      gb.addColorStop(0,"rgba(0,0,0,0)");gb.addColorStop(1,hexA(T.bg,.9));
      b.fillStyle=gb;b.fillRect(0,bgCv.height*.68,bgCv.width,bgCv.height*.32);
    }else{
      drawScene(b,bgCv.width,bgCv.height);   // gorsel yoksa prosedurel sahne
    }
  }catch(e){}
  b.fillStyle=T.dot;
  const mk=(x,y)=>!L.mask||L.mask(Math.max(0,Math.min(L.cols-1,x)),Math.max(0,Math.min(L.rows-1,y)));
  for(let i=0;i<=L.cols;i++)for(let j=0;j<=L.rows;j++){
    if(!(mk(i,j)||mk(i-1,j)||mk(i,j-1)||mk(i-1,j-1)))continue;
    b.beginPath();b.arc(ox+i*cell,oy+j*cell,1.1*DPR,0,7);b.fill();
  }
  stCv=document.createElement("canvas");
  stCv.width=cv.width;stCv.height=cv.height;
  stDirty=true;
}
window.addEventListener("resize",layout);

function updateProg(){

/* ---- gizli sure bonuslari ----
   Her bolumde birkac ok gizlice +sure tasir. Gorunumu normal okla
   ayni; oyuncu o oku cozdugunde sure artar + "+3sn" floater akar. */
function assignTimeBonuses(){
  if(!L||!L.snakes)return;
  L.snakes.forEach(s=>{s.timeBonus=0;});
  const n=L.snakes.length;
  // ok sayisina gore 1-4 adet bonus dagit (kucuk bolumde az, buyukte cok)
  let cnt=Math.max(1,Math.min(4,Math.round(n/6)));
  const pool=L.snakes.map((s,i)=>i);
  // Fisher-Yates karistir
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const AMT=[3,4,5];
  for(let k=0;k<cnt&&k<pool.length;k++){
    L.snakes[pool[k]].timeBonus=AMT[Math.floor(Math.random()*AMT.length)];
  }
}

/* ---- mekanik ---- */
function blockerOf(s){
  let x=s.head[0]+DIRS[s.dir][0],y=s.head[1]+DIRS[s.dir][1];
  while(x>=0&&x<L.cols&&y>=0&&y<L.rows){
    for(const o of L.snakes){
      if(o.alive&&o.id!==s.id&&o.cells.some(c=>c[0]===x&&c[1]===y))return {o,x,y};
    }
    x+=DIRS[s.dir][0];y+=DIRS[s.dir][1];
  }
  return null;
}
function buildTrack(s){ // kuyruk->kafa + kenar dışına uzatma
  const pts=s.cells.map(c=>[ox+c[0]*cell+cell/2,oy+c[1]*cell+cell/2]);
  const [dx,dy]=DIRS[s.dir];
  let hx=s.head[0],hy=s.head[1];
  const ext=Math.max(L.cols,L.rows)+s.cells.length+2;
  for(let i=1;i<=ext;i++)
    pts.push([ox+(hx+dx*i)*cell+cell/2,oy+(hy+dy*i)*cell+cell/2]);
  return pts;
}
function snakeNear(px,py){
  let best=null,bd=1e9;
  for(const o of L.snakes){
    if(!o.alive)continue;
    for(const c of o.cells){
      const dx=ox+c[0]*cell+cell/2-px,dy=oy+c[1]*cell+cell/2-py;
      const d=dx*dx+dy*dy;
      if(d<bd){bd=d;best=o;}
    }
  }
  return bd<=(cell*1.25)*(cell*1.25)?best:null;
}
function tapSnake(s){
  if(locked||paused||!L||!s)return;
  hintId=-1;
  const blk=blockerOf(s);
  if(!blk){
    s.alive=false;
    const now=Date.now();
    combo=(now-lastClear<3000)?combo+1:1;
    lastClear=now;
    sfx.fly();
    haptic("ok");
    const pts=10*combo;levelScore+=pts;
    floaters.push({x:ox+s.head[0]*cell+cell/2,y:oy+s.head[1]*cell+cell/2,
      txt:combo>1?"x"+combo:"+"+pts,c:colName(s),t:0});
    // Gizli sure bonusu: bu ok +sure tasiyorsa sureyi artir
    if(s.timeBonus>0&&!timeUp&&hearts>0){
      timeLeft+=s.timeBonus;
      floaters.push({x:ox+s.head[0]*cell+cell/2,y:oy+s.head[1]*cell+cell/2-cell*.9,
        txt:"+"+s.timeBonus+TX.sn,c:"#5FD68A",t:-.12});
      pluck(1046,.2);
      if(navigator.vibrate)navigator.vibrate([15,30,15]);
      s.timeBonus=0;
    }
    levelRemain--;
    // combo arttikca daha guclu patlama (madde 11: gorsel combo geri bildirimi)
    const burst=Math.min(6+combo*2,12);
    for(let i=0;i<burst;i++){
      particles.push({x:ox+s.head[0]*cell+cell/2,y:oy+s.head[1]*cell+cell/2,
        vx:(Math.random()-.5)*7*DPR,vy:(Math.random()-.7)*6*DPR,
        t:.6,c:colName(s),s:(1.5+Math.random()*2)*DPR});
    }
    updateProg();
    const track=buildTrack(s);
    const travel=track.length-s.cells.length;
    anims.push({type:"fly",s,track,t:0,dur:Math.min(travel/58+.05,.62),travel});
    if(!L.snakes.some(o=>o.alive)){locked=true;setTimeout(winLevel,500);}
  }else{
    combo=0;shakeT=.25;
    $("hearts").classList.add("flash");
    setTimeout(()=>$("hearts").classList.remove("flash"),420);
    sfx.bump();
    haptic("err");
    const gap=Math.abs(blk.x-s.head[0])+Math.abs(blk.y-s.head[1])-1;
    anims.push({type:"bump",s,track:buildTrack(s),t:0,dur:.5,gap:gap+.35});
    hearts--;updateHearts();
    if(hearts<=0){locked=true;setTimeout(()=>{sfx.fail();$("failT").textContent=TX.failT;$("reviveBtn").textContent=TX.revive;$("reviveBtn").dataset.mode="";$("reviveBtn").style.display="";$("failOv").classList.remove("hide");
      setTimeout(()=>{if(!nextCache)nextCache={n:mem.level,L:genLevel(mem.level)};},700);},550);}
  }
}
function winLevel(){
  sfx.win();
  for(let i=0;i<70;i++){
    particles.push({x:cv.width/2,y:cv.height/2.4,
      vx:(Math.random()-.5)*14*DPR,vy:(Math.random()-1.1)*11*DPR,
      t:0,c:T.mono?(i%3?T.mono:"#FFB347"):PALETTE[i%PALETTE.length],s:(2+Math.random()*3)*DPR});
  }
  const lost=maxH-hearts;
  const stars=lost===0?3:(lost<=Math.ceil(maxH*.4)?2:1);
  if(lost===0)levelScore+=100;
  mem.total=(mem.total||0)+levelScore;
  // Coin odulu: yildiz basina (madde 18 - ekonomi temeli)
  const reward=10+stars*5;
  mem.coins=(mem.coins|0)+reward;
  save();updateCoin();
  haptic("win");
  const sec=Math.round((Date.now()-levelStart)/1000);
  $("winStats").textContent=(lost===0?TX.perfect:"")+TX.score+" "+levelScore+" • "+TX.time+" "+sec+TX.sn+" • 🪙 +"+reward;
  ["st1","st2","st3"].forEach(id=>$(id).classList.remove("on"));
  setTimeout(()=>{
    $("winOv").classList.remove("hide");
    for(let i=0;i<stars;i++)
      setTimeout(()=>{$("st"+(i+1)).classList.add("on");sfx.tick();},250+i*280);
    setTimeout(()=>{const nn=mem.level+1;
      if(!nextCache)nextCache={n:nn,L:genLevel(nn)};},1200);
  },850);
}

function useHint(){
  if(locked||!L||hintId>=0)return;
  if(mem.hints<=0){
    // stok bitti: ödüllü reklamla +3 doldur
    tryRewarded(()=>{mem.hints+=3;save();updateHintBtn();sfx.win();},'ipucu');
    return;
  }
  const free=L.snakes.filter(s=>s.alive&&!blockerOf(s));
  if(!free.length)return;
  mem.hints--;save();updateHintBtn();
  hintId=free[Math.floor(Math.random()*free.length)].id;
  sfx.tick();
  setTimeout(()=>{hintId=-1;},2600);
}

/* ---- girdi ---- */
/* Yakınlaştırma: iki parmak sıkıştır (1x-3x), tek parmak kaydır.
   Kısa ve az hareketli dokunuş = ok seçimi. */
function clampView(){
  view.tx=Math.min(0,Math.max(cv.width*(1-view.s),view.tx));
  view.ty=Math.min(0,Math.max(cv.height*(1-view.s),view.ty));
}
function zoomAt(mx,my,f){
  const ns=Math.min(3,Math.max(1,view.s*f));
  const wx=(mx-view.tx)/view.s,wy=(my-view.ty)/view.s;
  view.s=ns;view.tx=mx-wx*ns;view.ty=my-wy*ns;clampView();
}
function setIcon(id,ch){
  const b=$(id);
  if(b&&b.firstChild&&b.firstChild.nodeType===3)b.firstChild.nodeValue=ch;
}
function updateZoomBtn(){
  const b=$("zoomBtn"),bd=$("zoomBdg");
  if(!b)return;
  // ikon: butonun ilk metin dugumu (rozet/etiket span'lerine dokunma)
  const zoomed=view.s>1;
  if(b.firstChild&&b.firstChild.nodeType===3)b.firstChild.nodeValue=zoomed?"↩":"🔍";
  if(bd)bd.textContent=zoomed?"1×":"2×";
}
const ptrs=new Map();
let tapCand=null,panMoved=false,pinchD=0;
cv.addEventListener("pointerdown",e=>{
  if(cv.setPointerCapture)try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){panMoved=false;tapCand={x:e.clientX,y:e.clientY};}
  else{tapCand=null;
    const a=[...ptrs.values()];
    pinchD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
});
cv.addEventListener("pointermove",e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const nx=e.clientX,ny=e.clientY;
  if(ptrs.size===2){
    const oe=[...ptrs.entries()].find(en=>en[0]!==e.pointerId);
    if(oe){
      const o=oe[1];
      const nd=Math.hypot(nx-o.x,ny-o.y);
      const r=cv.getBoundingClientRect();
      const mx=((nx+o.x)/2-r.left)*DPR,my=((ny+o.y)/2-r.top)*DPR;
      if(pinchD>4)zoomAt(mx,my,nd/pinchD);
      pinchD=nd;
    }
  }else if(view.s>1){
    view.tx+=(nx-p.x)*DPR;view.ty+=(ny-p.y)*DPR;clampView();
  }
  if(tapCand&&Math.hypot(nx-tapCand.x,ny-tapCand.y)>9)panMoved=true;
  p.x=nx;p.y=ny;
});
function ptrUp(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){
    if(tapCand&&!panMoved&&L){
      const r=cv.getBoundingClientRect();
      const px=((tapCand.x-r.left)*DPR-view.tx)/view.s;
      const py=((tapCand.y-r.top)*DPR-view.ty)/view.s;
      lastTapAt=Date.now();
      tapSnake(snakeNear(px,py));
    }
    tapCand=null;pinchD=0;updateZoomBtn();
  }
}
cv.addEventListener("pointerup",ptrUp);
/* GARANTILI DOKUNMA: bazi webview/onizleme ortamlarinda pointer olaylari
   canvas'a ulasmayabiliyor. click her ortamda gelir; pointerup ile
   cift tetiklenmeyi zaman damgasi ile engelliyoruz. */
let lastTapAt=0;
cv.addEventListener("click",e=>{
  if(!L)return;
  if(Date.now()-lastTapAt<400)return;   // pointerup zaten isledi
  const r=cv.getBoundingClientRect();
  const px=((e.clientX-r.left)*DPR-view.tx)/view.s;
  const py=((e.clientY-r.top)*DPR-view.ty)/view.s;
  tapSnake(snakeNear(px,py));
});

cv.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);tapCand=null;pinchD=0;});

$("zoomBtn").onclick=()=>{
  if(view.s>1){view.s=1;view.tx=0;view.ty=0;}
  else zoomAt(cv.width/2,cv.height/2,2);
  updateZoomBtn();sfx.tick();
};
$("hintBtn").onclick=useHint;

function checkDailyStreak(){

  if(mem.lastDay===today)return; // bugun zaten oynadi
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  mem.streak=(mem.lastDay===y)?((mem.streak||0)+1):1;
  mem.lastDay=today;
  mem.hints=(mem.hints||0)+2; // gunluk bonus
  save();updateHintBtn();
  return true; // bonus verildi
}

};
$("retryBtn").onclick=()=>{sfx.tick();$("failOv").classList.add("hide");startLevel(mem.level);};
$("contInfo").textContent=mem.level>1?TX.contL+" "+mem.level+" • "+TX.contS+" "+(mem.total||0):"";
if((mem.streak||0)>1){const se=document.getElementById("streakInfo");if(se)se.textContent=mem.streak+" "+TX.streak;}
setIcon("sndBtn",mem.sound?"♪":"✕");
const THEME_UNLOCK={ancient:1,void_:1,frozen:1,magma:6,bio:10,cyber:15,thunder:20,temple:26,abyss:32,cosmic:38,steam:45,dark:52,crystal:60,metro:70,solar:80};
function themeUnlocked(t){return (mem.maxLevel||mem.level||1)>=THEME_UNLOCK[t];}
$("thmBtn").onclick=()=>{
  const i=THEME_ORDER.indexOf(mem.theme);
  let ni=i,tries=0;
  do{ni=(ni+1)%THEME_ORDER.length;tries++;}
  while(!themeUnlocked(THEME_ORDER[ni])&&tries<10);
  mem.theme=THEME_ORDER[ni];save();
  T=THEMES[mem.theme]||THEMES.ancient;
  // Bolum tinti temizle - secilen temanin kendi rengi gelsin
  document.documentElement.style.removeProperty("--bg");
  document.documentElement.style.removeProperty("--bg2");
  
  // Dunya adini ekranda goster
  floaters.push({x:cv.width/2,y:cv.height/2.35,txt:(T.name||""),c:(T.pal&&T.pal[0])||T.text,t:-.15,big:true});
  const nxt=THEME_ORDER.find(t=>!themeUnlocked(t)&&THEME_UNLOCK[t]>(mem.maxLevel||1));
  if(nxt)floaters.push({x:cv.width/2,y:cv.height/1.72,
    txt:(LANG==="tr"?"Seviye ":"Level ")+THEME_UNLOCK[nxt]+(LANG==="tr"?": yeni tema":": new theme"),
    c:T.text,t:-1.1,big:false});
  applyTheme(mem.level);layout();stDirty=true;ambient=[];sfx.tick();updateNeonFx();haptic("tap");
  if(L){colorSnakes(L.snakes,mem.level,Math.random);}  // yeni temanin renkleri hemen uygulansin
};
updateHintBtn();
if(LANG!=="tr"){
  document.title="ARROWS — Knot Puzzle";
  $("lvlLbl").textContent=TX.level;$("subT").textContent=TX.sub;
  $("playBtn").textContent=TX.play;$("failT").textContent=TX.failT;
  $("failS").textContent=TX.failS;$("reviveBtn").textContent=TX.revive;
  $("retryBtn").textContent=TX.retry;$("winT").textContent=TX.winT;
  $("nextBtn").textContent=TX.next;
  // ikon butonlarin alt etiketleri (EN)
  const LBL={hintBtn:"HINT",zoomBtn:"ZOOM",resetBtn:"RESTART",pauseBtn:"PAUSE",thmBtn:"THEME",sndBtn:"SOUND"};
  for(const id in LBL){const e=$(id);const s2=e&&e.querySelector(".lbl");if(s2)s2.textContent=LBL[id];}
  $("pauseT").textContent=TX.pauseT;$("resumeBtn").textContent=TX.resume;
}

/* ---- çizim ---- */
function trackPoint(track,f){
  const i=Math.floor(f),r=f-i;
  const a=track[Math.min(i,track.length-1)],b=track[Math.min(i+1,track.length-1)];
  return [a[0]+(b[0]-a[0])*r,a[1]+(b[1]-a[1])*r];
}
function drawSnakePts(pts,color,alpha,glow,ws=1){
  if(pts.length<2)return;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.lineCap="round";ctx.lineJoin="round";
  const path=()=>{ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(const p of pts)ctx.lineTo(p[0],p[1]);};
  if(glow){
    ctx.save();
    ctx.globalAlpha=(typeof glow==="number"?glow:1);
    ctx.strokeStyle="#FFB347";ctx.lineWidth=cell*.75;
    ctx.shadowColor="#FFB347";ctx.shadowBlur=cell*1.2;
    path();ctx.stroke();ctx.restore();
  }
  // dış hat (zemin rengi) -> iç içe geçen yollar ayrışsın
  ctx.strokeStyle=T.outline;ctx.lineWidth=cell*.5*ws;
  path();ctx.stroke();
  // NEON: shadowBlur PAHALI -> yerine kalin yari saydam katmanlar (cok daha hizli)
  if(NEONFX){
    ctx.save();
    ctx.strokeStyle=color;
    ctx.globalAlpha=alpha*.13; ctx.lineWidth=cell*.72*ws; path();ctx.stroke();
    ctx.globalAlpha=alpha*.22; ctx.lineWidth=cell*.52*ws; path();ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle=color;ctx.lineWidth=cell*.32*ws;
  path();ctx.stroke();
  if(NEONFX){
    // ic cekirdek: ince acik cizgi -> tup/enerji goruntusu
    ctx.save();ctx.globalAlpha=alpha*.7;
    ctx.strokeStyle="#FFFFFF";ctx.lineWidth=cell*.10*ws;
    path();ctx.stroke();ctx.restore();
  }
  ctx.shadowBlur=0;
  // kuyruk noktası
  ctx.fillStyle=T.outline;
  ctx.beginPath();ctx.arc(pts[0][0],pts[0][1],cell*.065,0,7);ctx.fill();
  // kafa (ok ucu)
  const n=pts.length,h=pts[n-1],p2=pts[n-2];
  const ang=Math.atan2(h[1]-p2[1],h[0]-p2[0]);
  ctx.translate(h[0],h[1]);ctx.rotate(ang);
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(cell*.38*ws,0);
  ctx.lineTo(-cell*.05*ws,-cell*.23*ws);
  ctx.lineTo(-cell*.05*ws,cell*.23*ws);
  ctx.closePath();ctx.fill();
  ctx.restore();
}
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min((ts-last)/1000,.05);last=ts;
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!L)return;
  // Geri sayim: sadece oyun oynanirken (kilitli/bitmis/duraklatilmis degilken)
  if(!locked&&!timeUp&&!paused&&hearts>0){
    timeLeft-=dt;
    const secs=Math.max(0,Math.ceil(timeLeft));
    const disp=fmtTime(timeLeft);
    const tv=$("timerVal");
    if(tv&&tv.textContent!=disp)tv.textContent=disp;
    const tEl=$("timer");
    if(tEl)tEl.classList.toggle("low",secs<=10);
    if(timeLeft<=0){
      timeUp=true;locked=true;
      setTimeout(()=>{
        sfx.fail();
        $("failT").textContent=(LANG==="en"?"TIME'S UP":"SÜRE DOLDU");
        // Reklam izle -> sure yenile, kaldigin yerden devam (sinirsiz)
        $("reviveBtn").textContent=(LANG==="en"?"📺 WATCH, +TIME":"📺 İZLE, +SÜRE");
        $("reviveBtn").style.display="";
        $("reviveBtn").dataset.mode="time";
        $("failOv").classList.remove("hide");
        if(!nextCache)nextCache={n:mem.level,L:genLevel(mem.level)};
      },400);
    }
  }
  // ambient: suzulen isik zerreleri (hafif tutuldu - performans)
  if(ambient.length===0){
    for(let i=0;i<20;i++)ambient.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
      r:(0.6+Math.random()*1.5)*DPR,sp:(4+Math.random()*11)*DPR,ph:Math.random()*6.28,
      c:(NEONFX&&i%4===0)?"#6FD3FF":null});
  }
  ctx.save();
  for(const p of ambient){
    p.y-=p.sp*dt; if(p.y<-4){p.y=cv.height+4;p.x=Math.random()*cv.width;}
    const a=0.05+0.04*Math.sin(ts/700+p.ph);
    ctx.globalAlpha=a;ctx.fillStyle=p.c||T.mono||T.text;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.restore();
  ctx.save();
  if(shakeT>0){
    shakeT=Math.max(0,shakeT-dt);
    const m=cell*.14*(shakeT/.25);
    ctx.translate((Math.random()-.5)*2*m,(Math.random()-.5)*2*m);
  }
  ctx.translate(view.tx,view.ty);ctx.scale(view.s,view.s);
  const animIds=new Set(anims.map(a=>a.s.id));
  const lastFew=levelRemain<=3&&levelRemain>0&&hintId<0;
  const liveMode=anims.length>0||hintId>=0||lastFew||(ts-lvlT)<1000;
  if(!liveMode&&stCv){
    /* sakin an: 200+ yılanı tek resimden bas (performans) */
    if(stDirty){
      const sc=stCv.getContext("2d");
      sc.clearRect(0,0,stCv.width,stCv.height);
      if(bgCv)sc.drawImage(bgCv,0,0);
      const keep=ctx;ctx=sc;
      for(const s of L.snakes){
        if(!s.alive)continue;
        drawSnakePts(s.cells.map(c=>[ox+c[0]*cell+cell/2,oy+c[1]*cell+cell/2]),colName(s),1,false);
      }
      ctx=keep;stDirty=false;
    }
    ctx.drawImage(stCv,0,0);
  }else{
    stDirty=true;
    if(bgCv)ctx.drawImage(bgCv,0,0);
    let hinted=null;
    for(const s of L.snakes){
      if(!s.alive&&!animIds.has(s.id))continue;
      if(animIds.has(s.id))continue;
      if(s.id===hintId){hinted=s;continue;}
      const age=ts-lvlT-s.delay;
      if(age<0)continue;
      const ap=Math.min(age/240,1);
      const ws=ap<1?(.4+.75*easeOut(ap)-.15*easeOut(ap)*easeOut(ap)):1;
      const gl=lastFew?(.22+.14*Math.sin(ts/160)):false;
      drawSnakePts(s.cells.map(c=>[ox+c[0]*cell+cell/2,oy+c[1]*cell+cell/2]),
        colName(s),(hintId>=0?.2:1)*easeOut(ap),gl,ws);
    }
    if(hinted){
      const pulse=.7+.3*Math.sin(ts/110);
      drawSnakePts(hinted.cells.map(c=>[ox+c[0]*cell+cell/2,oy+c[1]*cell+cell/2]),colName(hinted),1,pulse);
    }
  }
  // animasyonlar
  for(let i=anims.length-1;i>=0;i--){
    const an=anims[i];an.t+=dt;
    const p=Math.min(an.t/an.dur,1);
    const bl=an.s.cells.length;
    let off;
    if(an.type==="fly"){
      off=(p<.18?easeInQ(p/.18)*.18:p)*an.travel;
      const pts=[];
      for(let k=0;k<bl;k++)pts.push(trackPoint(an.track,off+k));
      drawSnakePts(pts,colName(an.s),1-p*.25,false);
    }else{
      if(p<.5)off=easeOut(p*2)*an.gap;
      else off=an.gap*(1-easeOut((p-.5)*2));
      const shake=p>.5?Math.sin(p*55)*cell*.03*(1-p):0;
      const pts=[];
      for(let k=0;k<bl;k++){
        const pt=trackPoint(an.track,off+k);
        pts.push([pt[0]+shake,pt[1]]);
      }
      drawSnakePts(pts,colName(an.s),1,false);
    }
    if(p>=1)anims.splice(i,1);
  }
  // yüzen skor yazıları
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];f.t+=dt;
    const dur=f.big?1.5:.9;
    if(f.t>dur){floaters.splice(i,1);continue;}
    if(f.t<0)continue;
    const p2=f.t/dur;
    ctx.save();
    ctx.globalAlpha=Math.min(1,(1-p2)*2.2)*(f.big?.95:1);
    ctx.fillStyle=f.c;
    ctx.font="900 "+(f.big?38*DPR:cell*1.7)+"px system-ui";
    ctx.textAlign="center";
    if(f.big){ctx.shadowColor=T.bg;ctx.shadowBlur=16*DPR;}
    ctx.fillText(f.txt,f.x,f.y-p2*cell*(f.big?1.2:2));
    ctx.restore();
  }
  // konfeti
  for(let i=particles.length-1;i>=0;i--){
    const pt=particles[i];pt.t+=dt;
    if(pt.t>1.4){particles.splice(i,1);continue;}
    pt.vy+=22*DPR*dt;pt.x+=pt.vx;pt.y+=pt.vy;
    ctx.globalAlpha=Math.max(0,1-pt.t/1.4);
    ctx.fillStyle=pt.c;ctx.fillRect(pt.x,pt.y,pt.s,pt.s);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
layout();
requestAnimationFrame(frame);
</script>
