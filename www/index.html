<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141426">
<meta name="description" content="Renkli okların düğümünü çöz! Yolu açık oku bul, sırayla temizle.">
<title>OKLAR — Düğüm Bulmacası</title>
<style>
  :root{--bg:#141426;--bg2:#1D1D36;--line:#F5F1E6;--dim:#565678;--amber:#FFB347;--red:#E2554F}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--bg2) 0%,var(--bg) 62%),var(--bg);
    background-attachment:scroll;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--line)}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  #hud{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 8px}
  /* --- neon panel (gorseldeki cerceveli kapsuller) --- */
  .pan{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
    background:linear-gradient(180deg,rgba(40,52,92,.92),rgba(16,20,42,.92));
    border:1px solid rgba(120,190,255,.32);
    box-shadow:0 0 12px rgba(60,140,255,.22),inset 0 1px 0 rgba(180,220,255,.18)}
  #lvl{font-size:11px;font-weight:800;letter-spacing:.2em;color:#9FC4E8}
  #lvl b{color:#FFD34D;font-size:17px;letter-spacing:.04em;margin-left:6px;
    text-shadow:0 0 10px rgba(255,200,60,.6)}
  #timer{font-size:15px;font-weight:800;letter-spacing:.03em;color:#EAF4FF;min-width:52px;
    text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(120,200,255,.5)}
  #timer.low{color:var(--red);animation:tPulse .5s ease infinite}
  @keyframes tPulse{0%,100%{opacity:1}50%{opacity:.45}}
  #hearts{display:flex;gap:5px}
  .heart{width:11px;height:11px;border-radius:50% 50% 0 0/60% 60% 0 0;position:relative;
    background:#FF4D5E;transform:rotate(-45deg);transition:opacity .3s,transform .3s;
    filter:drop-shadow(0 0 4px rgba(255,70,90,.85))}
  .heart::after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;
    background:#FF4D5E;top:-5.5px;left:0}
  .heart::before{content:"";position:absolute;width:11px;height:11px;border-radius:50%;
    background:#FF4D5E;top:0;left:5.5px}
  .heart.off{opacity:.16;transform:rotate(-45deg) scale(.75);filter:none}
  /* --- yuvarlak neon ikon butonlar (gorseldeki daire butonlar) --- */
  .rnd{position:relative;width:54px;height:54px;border-radius:50%;font-size:21px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 50% 30%,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),
      radial-gradient(circle at 50% 115%,var(--c2),var(--c1) 62%);
    border:2px solid var(--cr);
    color:#fff;
    box-shadow:
      0 0 14px var(--cg),
      0 4px 0 rgba(6,10,26,.9),
      0 7px 16px rgba(0,0,0,.5),
      inset 0 2px 4px rgba(255,255,255,.35),
      inset 0 -4px 10px rgba(0,0,0,.45);
    text-shadow:0 2px 4px rgba(0,0,0,.6);
    transition:transform .1s,box-shadow .1s;
    /* varsayilan mavi */
    --c1:#1B3E86;--c2:#3E7BE0;--cr:rgba(140,205,255,.75);--cg:rgba(60,150,255,.45)}
  .rnd.cGold{--c1:#7A4A05;--c2:#F5B723;--cr:rgba(255,225,150,.8);--cg:rgba(245,180,40,.5)}
  .rnd.cGreen{--c1:#0E5C2E;--c2:#3ACC72;--cr:rgba(170,255,205,.8);--cg:rgba(50,205,110,.5)}
  .rnd.cPurple{--c1:#3E1C7A;--c2:#9B5CE8;--cr:rgba(215,180,255,.8);--cg:rgba(150,90,235,.5)}
  .rnd.cRed{--c1:#7A1520;--c2:#E8455C;--cr:rgba(255,180,190,.8);--cg:rgba(230,70,95,.5)}
  .rnd.cCyan{--c1:#0B5566;--c2:#2ECFE8;--cr:rgba(170,240,255,.8);--cg:rgba(45,205,230,.5)}
  .rnd:active{transform:translateY(4px);
    box-shadow:0 0 10px var(--cg),0 1px 0 rgba(6,10,26,.9),
      inset 0 2px 4px rgba(255,255,255,.25),inset 0 -3px 8px rgba(0,0,0,.4)}
  .rnd .bdg{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 4px;
    border-radius:999px;background:#2FBF5B;color:#fff;font-size:11px;font-weight:900;
    display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.5);
    box-shadow:0 0 8px rgba(50,220,120,.6)}
  .rnd .bdg.amb{background:#F5A623;box-shadow:0 0 8px rgba(245,166,35,.6)}
  .rnd .lbl{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
    font-size:8.5px;font-weight:800;letter-spacing:.08em;color:#9FC4E8;white-space:nowrap}
  #coin{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:900;color:#FFD34D;
    text-shadow:0 0 8px rgba(255,200,60,.55)}
  html.light{--bg:#F7F5F0;--bg2:#FFFFFF;--line:#1B1B1B;--dim:#A29C8E}
  html.light .ov{background:rgba(247,245,240,.95)}
  html.light #progWrap{background:#E4DFD2}
  html.light .big{color:#F7F5F0}
  html.light .big.ghost{color:#1B1B1B}
  html.light .pan{background:linear-gradient(180deg,#fff,#EFEBE0);border-color:#D8D3C5;box-shadow:none}
  html.light .rnd{background:#fff;border-color:#D8D3C5;color:#1B1B1B;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  html.light #lvl{color:#8A8477}html.light #lvl b{color:#1B1B1B;text-shadow:none}
  html.light #timer{color:#1B1B1B;text-shadow:none}
  html.light .rnd .lbl{color:#8A8477}
  #cv{flex:1 1 0;min-height:0;width:100%;touch-action:none;display:block}
  #foot{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:16px;
    padding:12px 10px calc(env(safe-area-inset-bottom,0px) + 26px)}
  .btn{background:var(--bg2);border:1px solid var(--dim);color:var(--line);
    border-radius:12px;padding:12px 22px;font-size:14px;font-weight:700;letter-spacing:.08em}
  .btn:active{transform:scale(.96)}
  .btn[disabled]{opacity:.35}
  .rnd[disabled]{opacity:.4}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(20,20,38,.94);z-index:10;text-align:center;
    padding:30px;transition:opacity .25s}
  .ov.hide{opacity:0;pointer-events:none}
  .logo{font-size:52px;font-weight:900;letter-spacing:.3em;margin-left:.3em}
  .logo .c1{color:#FF5D5D}.logo .c2{color:#FFB347}.logo .c3{color:#5FD68A}
  .logo .c4{color:#4FC3F7}.logo .c5{color:#C77DFF}
  .sub{margin-top:10px;font-size:13px;letter-spacing:.22em;color:var(--dim);font-weight:700}
  .big{margin-top:34px;background:var(--amber);color:var(--bg);border:none;border-radius:14px;
    padding:16px 44px;font-size:16px;font-weight:900;letter-spacing:.14em}
  .big:active{transform:scale(.96)}
  .ovMsg{font-size:26px;font-weight:900;letter-spacing:.18em}
  #progWrap{height:4px;margin:0 18px;border-radius:2px;background:#26263F;overflow:hidden}
  #progFill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#F4A261,#FFB347);
    transition:width .25s ease}
  .stars{font-size:46px;letter-spacing:.18em;margin-left:.18em;color:#33334F;margin-bottom:6px}
  .stars span{display:inline-block;transition:transform .3s cubic-bezier(.34,1.56,.64,1),color .3s}
  .stars .on{color:var(--amber);text-shadow:0 0 20px rgba(255,179,71,.55);transform:scale(1.15)}
  .big.alt{background:#5FD68A}
  .big.ghost{background:transparent;border:1px solid var(--dim);color:var(--line)}
  @keyframes hFlash{0%{filter:none}30%{filter:drop-shadow(0 0 8px #E2554F) brightness(1.6)}100%{filter:none}}
  #hearts.flash .heart{animation:hFlash .4s ease}
  .ovSmall{margin-top:8px;color:var(--dim);font-size:13px;font-weight:700;letter-spacing:.12em}

  /* ===== FAZ2: level complete / pause / market / basarimlar ===== */
  .card{background:linear-gradient(180deg,rgba(30,40,72,.96),rgba(14,18,38,.97));
    border:1px solid rgba(120,190,255,.35);border-radius:22px;padding:24px 22px;
    box-shadow:0 10px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(180,220,255,.18);
    width:min(92vw,400px);max-height:82vh;overflow-y:auto}
  .cardT{font-size:20px;font-weight:900;letter-spacing:.16em;color:#FFD34D;
    text-shadow:0 0 14px rgba(255,200,60,.5);margin-bottom:4px}
  .rowStat{display:flex;justify-content:space-between;align-items:center;
    padding:9px 4px;border-bottom:1px solid rgba(120,190,255,.12);
    font-size:13px;font-weight:700;letter-spacing:.06em;color:#C7DBF0}
  .rowStat b{color:#EAF4FF;font-size:15px}
  .rowStat:last-child{border-bottom:none}
  .rewardRow{display:flex;justify-content:center;gap:18px;margin:14px 0 6px}
  .rw{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:900;color:#FFD34D;
    opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
  .rw.on{opacity:1;transform:none}
  .mbtn{width:100%;margin-top:10px;padding:15px;border:none;border-radius:14px;
    font-size:15px;font-weight:900;letter-spacing:.1em;font-family:inherit;
    background:linear-gradient(135deg,#3E7BFA,#2E5FE0);color:#fff;
    box-shadow:0 6px 18px rgba(50,110,240,.4)}
  .mbtn.g{background:linear-gradient(135deg,#2FBF5B,#1E9A46);box-shadow:0 6px 18px rgba(45,190,90,.35)}
  .mbtn.o{background:linear-gradient(135deg,#F5A623,#E08600);box-shadow:0 6px 18px rgba(245,166,35,.35)}
  .mbtn.ghost{background:transparent;border:1px solid rgba(120,190,255,.4);
    color:#C7DBF0;box-shadow:none}
  .mbtn:active{transform:scale(.97)}
  .mbtn[disabled]{opacity:.4}
  .shopItem{display:flex;align-items:center;gap:12px;padding:12px 10px;
    border-radius:14px;background:rgba(255,255,255,.04);margin-bottom:9px;
    border:1px solid rgba(120,190,255,.14)}
  .shopItem .ic{font-size:24px;width:34px;text-align:center}
  .shopItem .tx{flex:1;text-align:left}
  .shopItem .tx b{display:block;font-size:14px;color:#EAF4FF;font-weight:800}
  .shopItem .tx span{font-size:11px;color:#9FC4E8}
  .buy{padding:9px 14px;border:none;border-radius:10px;font-weight:900;font-size:13px;
    background:linear-gradient(135deg,#F5A623,#E08600);color:#3A2400;font-family:inherit}
  .buy:disabled{opacity:.35}
  .buy.done{background:#2FBF5B;color:#fff}
  .achItem{display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px;
    background:rgba(255,255,255,.035);margin-bottom:8px;opacity:.45}
  .achItem.got{opacity:1;background:rgba(47,191,91,.14);border:1px solid rgba(47,191,91,.35)}
  .achItem .ic{font-size:22px}
  .achItem .tx b{display:block;font-size:13px;color:#EAF4FF}
  .achItem .tx span{font-size:11px;color:#9FC4E8}
  .menuBtns{display:flex;flex-direction:column;gap:0;width:min(88vw,340px);margin-top:22px}


  /* ===== PREMIUM BUTON GORUNUMU (saf CSS, asset yok) ===== */
  .mbtn{
    position:relative;overflow:hidden;
    background:linear-gradient(180deg,#4B7BE8 0%,#2E56C4 48%,#1E3E9E 100%);
    border:1px solid rgba(150,200,255,.55);
    box-shadow:0 5px 0 #14265E, 0 8px 18px rgba(0,0,0,.5),
               inset 0 1px 0 rgba(255,255,255,.45), inset 0 -3px 8px rgba(0,0,0,.35);
    text-shadow:0 2px 3px rgba(0,0,0,.55)}
  .mbtn::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;
    background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0));
    pointer-events:none}
  .mbtn:active{transform:translateY(3px);
    box-shadow:0 2px 0 #14265E, 0 4px 10px rgba(0,0,0,.45),
               inset 0 1px 0 rgba(255,255,255,.35)}
  .mbtn.g{background:linear-gradient(180deg,#48D97C 0%,#22B45A 48%,#158240 100%);
    border-color:rgba(160,255,200,.55);
    box-shadow:0 5px 0 #0C5228, 0 8px 18px rgba(0,0,0,.5),
               inset 0 1px 0 rgba(255,255,255,.45), inset 0 -3px 8px rgba(0,0,0,.3)}
  .mbtn.g:active{box-shadow:0 2px 0 #0C5228, 0 4px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35)}
  .mbtn.o{background:linear-gradient(180deg,#FFD35C 0%,#F0A017 48%,#C87A08 100%);
    border-color:rgba(255,225,160,.6);
    box-shadow:0 5px 0 #7A4A05, 0 8px 18px rgba(0,0,0,.5),
               inset 0 1px 0 rgba(255,255,255,.5), inset 0 -3px 8px rgba(0,0,0,.3);
    color:#3A2400;text-shadow:0 1px 1px rgba(255,255,255,.35)}
  .mbtn.o:active{box-shadow:0 2px 0 #7A4A05, 0 4px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4)}
  .mbtn.ghost{background:linear-gradient(180deg,rgba(70,95,150,.5),rgba(24,32,64,.6));
    border:1px solid rgba(130,185,255,.42);color:#CFE2F7;
    box-shadow:0 4px 0 rgba(10,16,40,.7), 0 6px 14px rgba(0,0,0,.4),
               inset 0 1px 0 rgba(255,255,255,.18)}
  .mbtn.ghost:active{box-shadow:0 1px 0 rgba(10,16,40,.7),inset 0 1px 0 rgba(255,255,255,.15)}
  /* ana menu OYNA butonu */
  .big{
    position:relative;overflow:hidden;
    background:linear-gradient(180deg,#FFD35C 0%,#F5A623 48%,#C87A08 100%);
    color:#3A2400;border:1px solid rgba(255,230,170,.6);
    box-shadow:0 6px 0 #7A4A05, 0 10px 22px rgba(0,0,0,.5),
               inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 8px rgba(0,0,0,.28);
    text-shadow:0 1px 1px rgba(255,255,255,.4)}
  .big::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;
    background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));
    pointer-events:none}
  .big:active{transform:translateY(3px);
    box-shadow:0 3px 0 #7A4A05, 0 5px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45)}
  .big.alt{background:linear-gradient(180deg,#48D97C,#22B45A 48%,#158240);
    color:#062E15;box-shadow:0 6px 0 #0C5228, 0 10px 22px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.5)}
  .big.ghost{background:linear-gradient(180deg,rgba(70,95,150,.5),rgba(24,32,64,.65));
    color:#CFE2F7;border:1px solid rgba(130,185,255,.4);
    box-shadow:0 4px 0 rgba(10,16,40,.7),0 6px 14px rgba(0,0,0,.4)}


  .rnd .em{position:relative;z-index:2}
  .rnd .ico{display:none;position:absolute;inset:8px;border-radius:50%;
    background-size:cover;background-position:center;
    mix-blend-mode:screen;pointer-events:none;z-index:2}

  .rnd .em{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
    width:26px;height:26px;color:#fff;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
  .rnd .em svg{width:100%;height:100%;display:block}
  .rnd .ico{display:none}

  /* Ana menu sinematik arka plan (gorsel yoksa duz zemin kalir) */
  #startOv{background-size:cover;background-position:center}
  #startOv.hasBg::before{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(8,10,24,.55),rgba(8,10,24,.88));pointer-events:none}
  #startOv>*{position:relative;z-index:1}
  /* Basarim rozetleri (buyuk gosterim) */
  .achItem .ic{width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    background-size:cover;background-position:center;border-radius:8px;flex:0 0 34px}

  .achItem .ic .fb{font-size:20px;line-height:1}
  .achItem .ic[style*="background-image"] .fb{display:none}

  .wthumb{display:block;width:34px;height:34px;border-radius:8px;
    background-size:cover;background-position:center;
    border:1px solid rgba(120,190,255,.35)}

  /* --- hazine sandigi --- */
  #chestOv{background:rgba(10,14,30,.92)}
  .chest{width:150px;height:150px;margin:14px auto 6px;display:flex;
    align-items:center;justify-content:center;position:relative;
    background-size:contain;background-repeat:no-repeat;background-position:center;
    animation:chestIdle 1.6s ease-in-out infinite}
  .chest .cbox{font-size:96px;filter:drop-shadow(0 0 22px rgba(255,200,60,.7))}
  .chest.open{animation:chestPop .5s cubic-bezier(.2,1.6,.4,1) forwards}
  @keyframes chestIdle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.03)}}
  @keyframes chestPop{0%{transform:scale(1)}45%{transform:scale(1.28) rotate(-4deg)}100%{transform:scale(1.1)}}
  /* --- dunya sinemasi --- */
  #worldOv{background-size:cover;background-position:center;background-color:#080b18}
  .wcard{display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:26px 30px;border-radius:22px;
    background:linear-gradient(180deg,rgba(10,14,32,.30),rgba(10,14,32,.86));
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);width:min(92vw,420px)}
  .wsub{font-size:11px;font-weight:800;letter-spacing:.24em;color:#9FC4E8}
  .wname{font-size:30px;font-weight:900;letter-spacing:.10em;color:#FFD34D;
    text-shadow:0 0 22px rgba(255,200,60,.65);margin-bottom:14px;text-align:center}

  .shopItem.free{background:linear-gradient(90deg,rgba(47,191,91,.18),rgba(47,191,91,.06));
    border-color:rgba(47,191,91,.45)}
  .buy.freeBtn{background:linear-gradient(135deg,#2FBF5B,#1E9A46);color:#fff}

  .shopItem.prem{background:linear-gradient(90deg,rgba(255,190,60,.16),rgba(255,190,60,.04));
    border-color:rgba(255,200,80,.45)}
  .shopItem.prem .tx span{color:#FFD98A}

  /* --- seviye haritasi --- */
  .wgrp{margin-bottom:16px}
  .wgrpT{font-size:11px;font-weight:800;letter-spacing:.16em;color:#9FC4E8;
    margin:0 0 8px 2px;display:flex;align-items:center;gap:8px}
  .wgrpT i{flex:1;height:1px;background:rgba(120,190,255,.22);display:block}
  .lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .lcell{height:62px;border-radius:12px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;position:relative;
    background:linear-gradient(180deg,rgba(60,85,145,.55),rgba(20,28,58,.75));
    border:1px solid rgba(120,190,255,.25);
    font-size:15px;font-weight:900;color:#EAF4FF;cursor:pointer;
    box-shadow:0 3px 0 rgba(8,14,34,.7),inset 0 1px 0 rgba(190,225,255,.2)}
  .lcell:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(8,14,34,.7)}
  .lcell.done{background:linear-gradient(180deg,rgba(47,160,90,.6),rgba(14,70,40,.8));
    border-color:rgba(120,255,180,.4)}
  .lcell.cur{background:linear-gradient(180deg,#F5B723,#C87A08);color:#3A2400;
    border-color:rgba(255,230,160,.75);
    box-shadow:0 0 16px rgba(245,180,40,.6),0 3px 0 #7A4A05;
    animation:curPulse 1.5s ease-in-out infinite}
  @keyframes curPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .lcell.lock{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.10);
    color:#5C6B85;box-shadow:none;cursor:default}
  .lstars{font-size:8px;letter-spacing:1px;line-height:1;color:#FFD34D}
  .lcell.lock .lstars{display:none}

  /* ===== CANDY CRUSH TARZI SEVIYE PATIKASI ===== */
  #lvlOv{background:#080b18}
  #lvlTop{position:fixed;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
    background:linear-gradient(180deg,rgba(8,11,24,.96),rgba(8,11,24,.0))}
  #lvlScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch}
  #lvlPath{position:relative;width:100%}
  .wband{position:absolute;left:0;right:0;background-size:cover;background-position:center}
  .wband::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(8,11,24,.62),rgba(8,11,24,.78))}
  .wlabel{position:absolute;left:0;right:0;text-align:center;z-index:3;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;}}
const easeOut=t=>1-Math.pow(1-t,3);
const easeInQ=t=>t*t;

function fmtTime(s){s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),ss=s%60;return m+":"+(ss<10?"0"+ss:ss);}

/* ---- kayıt ---- */
let mem={level:1,sound:1,total:0,hints:3};
try{const s=localStorage.getItem("oklar2");if(s)mem=JSON.parse(s);}catch(e){}
if(mem.hints===undefined)mem.hints=3;

if(mem.coins===undefined)mem.coins=0;
if(mem.haptic===undefined)mem.haptic=1;
/* Kayit dogrulama: yanlis tipte gelen alanlari guvenle sifirla */
const _obj=v=>(v&&typeof v==="object"&&!Array.isArray(v))?v:{};
const _num=(v,d)=>(typeof v==="number"&&isFinite(v)&&v>=0)?v:d;
mem.ach=_obj(mem.ach);           // basarimlar {id:1}
mem.best=_obj(mem.best);         // seviye bazli en iyi {lvl:{s,sc,t}}
mem.owned=_obj(mem.owned);       // altinla acilan temalar {tema:1}
mem.seenWorld=_obj(mem.seenWorld);
mem.coins=Math.min(_num(mem.coins,0),9e12);
mem.hints=Math.min(_num(mem.hints,3),9999);
mem.total=Math.min(_num(mem.total,0),9e12);
mem.level=Math.max(1,Math.min(Math.round(_num(mem.level,1)),999999));
mem.maxLevel=Math.max(1,Math.min(Math.round(_num(mem.maxLevel,mem.level)),999999));
mem.noHintRun=_num(mem.noHintRun,0);
const THEMES={
  ancient:{name:"ANCIENT CORE",bg:"#1A1206",bg2:"#2B1E0A",dot:"#2E2411",outline:"#1A1206",text:"#FFE9B8",mono:null,

    pal:["#F5C542","#E0A81E","#FFD873","#C89018","#FFE49B","#DEB43A","#A87512","#FFCE5C","#D4A32E","#FFDF8A"]},

const THEME_ORDER=["ancient","void_","frozen","magma","bio","cyber","thunder","temple","abyss","cosmic","steam","dark","crystal","metro","solar"];
if(!THEMES[mem.theme])mem.theme="ancient";   // eski kayitlar icin guvenli gecis
let T=THEMES[mem.theme];
const colName=s=>T.mono||s.color;

const save=()=>{try{localStorage.setItem("oklar2",JSON.stringify(mem));}catch(e){}};

/* ---- ses ---- */
let AC=null;
/* iOS/Safari: ses ancak kullanici dokununca baslar ve arka plandan donunce
   askida ("suspended") kalir. Her seste ve ilk dokunusta uyandiriyoruz. */
let _acSon=0;
function acWake(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    // resume() pahalidir: her seste degil, en fazla saniyede bir dene
    if(AC.state==="suspended"&&AC.resume){
      const t=Date.now();
      if(t-_acSon>1000){_acSon=t;AC.resume();}
    }
  }catch(e){}
  return AC;
}
(function(){
  const uyandir=function(){acWake();};
  ["touchend","pointerup","click","keydown"].forEach(function(ev){
    document.addEventListener(ev,uyandir,{passive:true});
  });
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden)acWake();
  });
})();
function beep(f,dur,type="sine",vol=.18,slide=0){

/* ================= SEVİYE ÜRETİMİ =================
   Yılan-oklar ters sırayla yerleştirilir. Her yeni yılanın
   kafa ışını (çıkış yolu) o ana dek konan yılanların
   hücrelerine ve kendi gövdesine çarpmaz -> yerleştirmenin
   tersi sırayla oynanınca seviye HER ZAMAN çözülür.
   Sonradan konan gövdeler öncekilerin çıkışını kapatır:
   düğüm böyle oluşur. */
/* TAM DOLULUK ÜRETİMİ (7+ seviyeler):
   1) Tahta, kıvrımlı "solucan" yollarıyla ~%100 döşenir.
   2) Kenardan içe soyma: düz çıkış koridoru o an boşalmış olan her
      solucan sırayla soyulur, kafa/yön soyulma anına göre atanır.
   Soyma sırası = garantili çözüm. Soyulamayan nadir solucanlar

/* Orijinaldeki gibi organik tahta şekilleri: seviyeler dikdörtgen,
   elips, kalp, elmas ve blob arasında döner. */
// Ilk bolumler tek renk (ogretici), sonrasi rengarenk
const SOLO_COLORS=["#FFD93D","#FF5252","#4EC3F5","#5FD98A","#FF9E47","#C77DFF","#3DFFD9","#FF6B9D","#B8FF3B","#FF8A5C"]; // sari,kirmizi,mavi,yesil,turuncu,mor,turkuaz,pembe,yesilimsi,somon
function colorSnakes(snakes,n,rnd){
  // Renk ritmi (16 bolumluk dongu):
  //  1-6  : tek renk (her bolum farkli)
  //  7-10 : karisik (rengarenk)
  //  11-16: 2serli tek renk (11-12 ayni, 13-14 ayni, 15-16 ayni)
  //  sonra dongu bassa doner
  const c=((n-1)%16)+1; // 1..16 arası konum
  // Tek renk seviyelerde de AKTIF TEMANIN paleti kullanilir -> her dunya kendi atmosferini korur
  const SC=(T&&T.pal&&T.pal.length)?T.pal:SOLO_COLORS;
  let mode,soloColor=null;
  // Ritim: tek renk -> COK RENKLI -> tek renk ... (renkli seviye orani artirildi)
  if(c<=4){ mode="solo"; soloColor=SC[(c-1)%SC.length]; }
  else if(c<=8){ mode="mix"; }                       // 4 renkli seviye
  else if(c<=12){ mode="solo"; soloColor=SC[(c-9)%SC.length]; }
  else { mode="mix"; }                               // 4 renkli seviye daha

  if(mode==="solo"){
    snakes.forEach((s,i)=>{s.color=soloColor;s.delay=(i/snakes.length)*600+rnd()*40;});
  }else{
    // Cok renkli seviyeler: gokkusagi paleti + temanin imza rengi
    const base=PALETTE.slice();
    if(T.pal&&T.pal[0])base.push(T.pal[0],T.pal[2]||T.pal[0]);
    const cshuf=base.sort(()=>Math.random()-.5);
    snakes.forEach((s,i)=>{s.color=cshuf[i%cshuf.length];s.delay=(i/snakes.length)*600+rnd()*40;});
  }
}
function maskFor(n,cols,rows,rnd,forceType){
  const type=(forceType===undefined)?(n-7)%13:forceType;
  const f1=rnd()*6.28,f2=rnd()*6.28,rot=rnd()*6.28;
  // Parametrik varyasyon: her bolumde donme + hafif olcek/gerilme
  // Boylece 13 temel sekil yuzlerce farkli gorunume donusur
  const gRot=rnd()*6.28;                 // sekil dondurme acisi
  const sx=0.86+rnd()*0.28;              // yatay olcek (0.86-1.14)
  const sy=0.86+rnd()*0.28;              // dikey olcek
  const cosG=Math.cos(gRot),sinG=Math.sin(gRot);
  return (x,y)=>{
    let u0=(x+.5-cols/2)/(cols/2),v0=(y+.5-rows/2)/(rows/2);
    // olcekle + dondur
    u0/=sx; v0/=sy;
    const u=u0*cosG-v0*sinG, v=u0*sinG+v0*cosG;
    if(type===0)return Math.abs(u)<=1&&Math.abs(v)<=1; // dikdörtgen (dondurulur)
    if(type===1)return u*u+v*v<=1.02;                          // elips
    if(type===2){                                              // kalp
      const X=u*1.25,Y=-v*1.25+.25,q=X*X+Y*Y-1;
      return q*q*q-X*X*Y*Y*Y<=0;
    }
    if(type===3)return Math.abs(u)+Math.abs(v)<=1.12;          // elmas
    if(type===4){                                              // blob
      const r=Math.hypot(u,v),th=Math.atan2(v,u);
      return r<=.92+.16*Math.sin(3*th+f1)+.11*Math.sin(5*th+f2);
    }
    if(type===5){                                              // yıldız (5 uçlu)
      const r=Math.hypot(u,v),th=Math.atan2(v,u)+rot;
      const k=0.72+0.34*Math.abs(Math.cos(2.5*th));
      return r<=1.02/k*0.82;
    }
    if(type===6){                                              // altıgen
      const au=Math.abs(u),av=Math.abs(v);
      return (av<=0.92)&&(0.5*av+0.866*au<=0.92);
    }
    if(type===7){                                              // artı / haç
      return (Math.abs(u)<=0.42)||(Math.abs(v)<=0.42);
    }
    if(type===8){                                              // üçgen
      return (v<=0.82)&&(v>=-0.72)&&(Math.abs(u)<=(0.82-v)*0.62);
    }
    if(type===9){                                              // çiçek (6 yaprak)
      const r=Math.hypot(u,v),th=Math.atan2(v,u)+rot;
      return r<=.62+.34*Math.abs(Math.sin(3*th));
    }
    if(type===10){                                             // dişli / çark
      const r=Math.hypot(u,v),th=Math.atan2(v,u)+rot;
      return r<=.88+.12*Math.sign(Math.sin(8*th));
    }
    if(type===11){                                             // yıldız (6 uçlu)
      const r=Math.hypot(u,v),th=Math.atan2(v,u)+rot;
      const k=0.70+0.36*Math.abs(Math.cos(3*th));
      return r<=1.0/k*0.80;
    }
    // type===12 halka + orta (yuvarlak köşeli kare)
    const p=4;
    return Math.pow(Math.abs(u),p)+Math.pow(Math.abs(v),p)<=Math.pow(0.95,p);
  };
}
function packWorms(cols,rows,rnd,mask){
  const inB=(x,y)=>x>=0&&x<cols&&y>=0&&y<rows;
  const inM=(x,y)=>inB(x,y)&&(!mask||mask(x,y));
  const idxOf=(x,y)=>y*cols+x;
  const owner=new Array(cols*rows).fill(-1);
  const worms=[];
  const order=[...Array(cols*rows).keys()].filter(ci=>inM(ci%cols,Math.floor(ci/cols)));
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(rnd()*(i+1));[order[i],order[j]]=[order[j],order[i]];
  }
  const wLen=()=>{const r=rnd();
    if(r<.32)return 2+Math.floor(rnd()*2);
    if(r<.70)return 4+Math.floor(rnd()*3);
    return 7+Math.floor(rnd()*4);};
  for(const ci of order){
    if(owner[ci]!==-1)continue;
    const path=[[ci%cols,Math.floor(ci/cols)]];
    owner[ci]=worms.length;
    const target=wLen();
    while(path.length<target){
      const [lx,ly]=path[path.length-1];
      const opts=[];
      for(const d of [0,1,2,3]){
        const nx=lx+DIRS[d][0],ny=ly+DIRS[d][1];
        if(inM(nx,ny)&&owner[idxOf(nx,ny)]===-1)opts.push([nx,ny]);
      }
      if(!opts.length)break;
      let p;
      if(path.length>1&&rnd()<.45){
        const [px,py]=path[path.length-2];
        const sx=lx+(lx-px),sy=ly+(ly-py);
        p=opts.find(o=>o[0]===sx&&o[1]===sy)||opts[Math.floor(rnd()*opts.length)];
      }else p=opts[Math.floor(rnd()*opts.length)];
      owner[idxOf(p[0],p[1])]=worms.length;
      path.push(p);
    }
    worms.push({cells:path});
  }
  // tekli hücreleri komşu solucanın UCUNA kaynaştır
  for(const w of worms){
    if(w.cells.length>1||w.dead)continue;
    const [x,y]=w.cells[0];let ok=false;
    for(const d of [0,1,2,3]){
      const nx=x+DIRS[d][0],ny=y+DIRS[d][1];
      if(!inM(nx,ny))continue;
      const oi=owner[idxOf(nx,ny)];
      const o=worms[oi];
      if(!o||o.dead||o===w||o.cells.length>=10)continue;
      const h=o.cells[o.cells.length-1],t=o.cells[0];
      if(h[0]===nx&&h[1]===ny){o.cells.push([x,y]);owner[idxOf(x,y)]=oi;ok=true;break;}
      if(t[0]===nx&&t[1]===ny){o.cells.unshift([x,y]);owner[idxOf(x,y)]=oi;ok=true;break;}
    }
    w.dead=true;
    if(!ok)owner[idxOf(x,y)]=-1; // delik
  }
  const live=worms.filter(w=>!w.dead);
  // soyma
  const present=new Set();
  for(const w of live){w.peeled=false;for(const c of w.cells)present.add(key(c[0],c[1]));}
  function rayClear(x,y,dx,dy){
    let cx=x+dx,cy=y+dy;
    while(inB(cx,cy)){
      if(present.has(key(cx,cy)))return false;
      cx+=dx;cy+=dy;
    }
    return true;
  }
  const solved=[];
  function peelPass(){
    let any=false;
    for(const w of live){
      if(w.peeled)continue;
      const c=w.cells;
      const ends=[[c[c.length-1],c[c.length-2],false],[c[0],c[1],true]];
      for(const [head,prev,rev] of ends){
        const dx=head[0]-prev[0],dy=head[1]-prev[1];
        if(!rayClear(head[0],head[1],dx,dy))continue;
        if(rev)w.cells=[...c].reverse();
        w.dir=DIRS.findIndex(v=>v[0]===dx&&v[1]===dy);
        w.head=w.cells[w.cells.length-1];
        w.peeled=true;solved.push(w);
        for(const cc of w.cells)present.delete(key(cc[0],cc[1]));
        any=true;break;
      }
    }
    return any;
  }
  // tıkanınca: en uzun sıkışmış solucanı ikiye böl (yeni uçlar = yeni çıkışlar)
  let guardP=0;
  while(guardP++<2000){
    while(peelPass());
    const stuck=live.filter(w=>!w.peeled);
    if(!stuck.length)break;
    stuck.sort((a,b)=>b.cells.length-a.cells.length);
    const w=stuck[0];
    if(w.cells.length>=4){
      const cut=rnd()<.5?2:w.cells.length-2; // uçtan kes: uzun taraf hayatta kalsın
      const a={cells:w.cells.slice(0,cut),peeled:false};
      const b={cells:w.cells.slice(cut),peeled:false};
      live.splice(live.indexOf(w),1,a,b);
    }else{
      for(const cc of w.cells)present.delete(key(cc[0],cc[1])); // delik
      live.splice(live.indexOf(w),1);
    }
  }
  return solved; // soyma sırası = çözüm sırası
}
/* ---- ZORLUK EGRISI ----
   Izgara ve doluluk seviyeyle KADEMELI artar; oyuncu ilerledigini hisseder.
   1-10 ogrenme, 11-30 kolay, 31-60 orta, 61-100 zor, 100+ uzman.        */
function diffFor(n){
  let cols,rows,fill;
  if(n<=30){                       // kolay: izgara 11x17 -> 15x25
    const t=(n-10)/20;
    cols=11+Math.round(t*4); rows=17+Math.round(t*8); fill=0.60+t*0.10;
  }else if(n<=60){                 // orta: 15x25 -> 18x30
    const t=(n-30)/30;
    cols=15+Math.round(t*3); rows=25+Math.round(t*5); fill=0.70+t*0.10;
  }else if(n<=100){                // zor: 18x30 -> 20x34
    const t=(n-60)/40;
    cols=18+Math.round(t*2); rows=30+Math.round(t*4); fill=0.80+t*0.08;
  }else{                           // uzman: tam izgara, en yogun
    cols=20; rows=34; fill=0.93;
  }
  return {cols,rows,fill};
}
function genLevel(n){
  const rnd=mulberry32(n*2654435761+1299709);
  const RAMP=[[5,7,6],[6,9,10],[7,11,15],[8,13,20],[9,15,26],[10,16,32]];
  let cols,rows,nSnakes;
  if(n<=6){[cols,rows,nSnakes]=RAMP[n-1];}
  else{
    const D=diffFor(n);
    cols=D.cols;rows=D.rows;
    // HEDEF ALAN: izgaranin ne kadari dolsun (zorluk egrisini duzenli tutar)
    const hedefAlan=cols*rows*D.fill;
    let mask=null,mcells=0,enIyiFark=Infinity;
    for(let ti=0;ti<5;ti++){
      const tip=((n-7)+ti*5)%13;                    // farkli sekiller dene
      const r2=mulberry32(n*2654435761+1299709+ti*7919);
      const m=maskFor(n,cols,rows,r2,tip);
      let c=0;
      for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(m(x,y))c++;
      const fark=Math.abs(c-hedefAlan);
      if(fark<enIyiFark){enIyiFark=fark;mask=m;mcells=c;}
      if(fark<hedefAlan*0.10)break;                 // yeterince yakin
    }
    let bestS=null,bestF=0;
    for(let t=0;t<4;t++){
      const S=packWorms(cols,rows,rnd,mask);
      const f=S.reduce((a,w)=>a+w.cells.length,0)/mcells;
      if(f>bestF){bestF=f;bestS=S;}
      if(f>=diffFor(n).fill)break;   // hedef doluluk seviyeye gore
    }
    const snakes=bestS.map((w,i)=>({id:i,cells:w.cells,head:w.head,dir:w.dir,alive:true}));
    colorSnakes(snakes,n,rnd);
    return {cols,rows,snakes,mask};
  }
  // karışık uzunluk: çoğunluk kısa (2-3), orta (4-6), az sayıda uzun (7-10)
  function pickLen(){
    const r=rnd();
    if(r<.45)return 2+Math.floor(rnd()*2);      // 2-3
    if(r<.82)return 4+Math.floor(rnd()*3);      // 4-6
    return 7+Math.floor(rnd()*4);               // 7-10
  }
  const occ=new Map(); // "x,y" -> snake index
  const snakes=[];
  const inB=(x,y)=>x>=0&&x<cols&&y>=0&&y<rows;
  function rayFrom(x,y,d){ // kafadan kenara hücreler
    const out=[];let cx=x+DIRS[d][0],cy=y+DIRS[d][1];
    while(inB(cx,cy)){out.push([cx,cy]);cx+=DIRS[d][0];cy+=DIRS[d][1];}
    return out;
  }
  function allRays(){ // zincir yanlılığı için mevcut çıkış ışınları
    const s=new Set();
    for(const sn of snakes)for(const c of rayFrom(sn.head[0],sn.head[1],sn.dir))s.add(key(c[0],c[1]));
    return s;
  }
  let guard=0;
  while(snakes.length<nSnakes&&guard<100000){
    guard++;
    // merkez-önce yanlılığı: erken yerleştirmeler merkeze, geç olanlar kenara
    const prog=snakes.length/nSnakes;
    let hx,hy,bestScore=-1;
    for(let c=0;c<3;c++){
      const tx=Math.floor(rnd()*cols),ty=Math.floor(rnd()*rows);
      if(occ.has(key(tx,ty)))continue;
      const cen=1-((Math.abs(tx-(cols-1)/2)/cols)+(Math.abs(ty-(rows-1)/2)/rows));
      const sc=prog<.55?cen:(1-cen);
      if(sc>bestScore){bestScore=sc;hx=tx;hy=ty;}
    }
    if(bestScore<0)continue;
    const ds=[0,1,2,3].sort(()=>rnd()-.5);
    let dir=-1,ray=null;
    for(const d of ds){
      const r=rayFrom(hx,hy,d);
      if(r.every(c=>!occ.has(key(c[0],c[1])))){dir=d;ray=r;break;}
    }
    if(dir<0)continue;
    const rayset=new Set(ray.map(c=>key(c[0],c[1])));
    // gövde: kafadan geriye rastgele yürüyüş
    const body=[[hx,hy]];
    const bset=new Set([key(hx,hy)]);
    const px=hx-DIRS[dir][0],py=hy-DIRS[dir][1];
    if(!inB(px,py)||occ.has(key(px,py))||rayset.has(key(px,py)))continue;
    body.push([px,py]);bset.add(key(px,py));
    const rays=allRays();
    const len=guard>20000?2:pickLen();
    while(body.length<len){
      const [lx,ly]=body[body.length-1];
      const opts=[];
      for(const d of [0,1,2,3]){
        const nx=lx+DIRS[d][0],ny=ly+DIRS[d][1],k2=key(nx,ny);
        if(!inB(nx,ny)||occ.has(k2)||bset.has(k2)||rayset.has(k2))continue;
        opts.push([nx,ny,rays.has(k2)?1:0]);
      }
      if(!opts.length)break;
      // %65 zincir yanlılığı: başka yılanın çıkışını kapatan hücreyi seç
      const chain=opts.filter(o=>o[2]);
      const pick=(chain.length&&rnd()<.8)?chain[Math.floor(rnd()*chain.length)]
                                          :opts[Math.floor(rnd()*opts.length)];
      body.push([pick[0],pick[1]]);bset.add(key(pick[0],pick[1]));
    }
    if(body.length<2)continue;
    body.reverse(); // artık kuyruk->kafa sırası
    const idx=snakes.length;
    for(const c of body)occ.set(key(c[0],c[1]),idx);
    snakes.push({id:idx,cells:body,head:[hx,hy],dir,
      color:PALETTE[idx%PALETTE.length],alive:true});
  }
  // renkleri karıştır
  colorSnakes(snakes,n,rnd);
  return {cols,rows,snakes};
}

function levelTime(n){
  // Baslangicta bol, ilerledikce kisalir; 100+ seviyede taban 52sn
  let base;
  if(n<=10)base=80;
  else if(n<=30)base=76-(n-10)*0.5;      // 76 -> 66
  else if(n<=60)base=66-(n-30)*0.25;     // 66 -> 58
  else if(n<=100)base=58-(n-60)*0.15;    // 58 -> 52
  else base=52;
  return Math.round(base+4*Math.cos(n*Math.PI/5.5));  // hafif dalga (monotonluk kirilir)
}

function haptic(kind){
  if(mem.haptic===0)return;
  try{
    if(!navigator.vibrate)return;
    if(kind==="tap")navigator.vibrate(10);
    else if(kind==="ok")navigator.vibrate(22);
    else if(kind==="win")navigator.vibrate([0,35,60,55]);
    else if(kind==="err")navigator.vibrate([0,18,40,18]);
  }catch(e){}
}

/* ============ DUNYA ARKA PLAN GORSELLERI (gercek asset) ============
   Dosyalar: www/assets/bg/<tema>.jpg  (yoksa prosedurel sahne kullanilir)
   Bir kez yuklenir, bellekte tutulur; her karede maliyet yok.        */
const BGIMG={};           // key -> {img, ok}
function bgImageFor(key){
  let e=BGIMG[key];
  if(e)return e.ok?e.img:null;
  e=BGIMG[key]={img:new Image(),ok:false};
  e.img.onload=()=>{e.ok=true;layout();stDirty=true;};  // gelince yeniden ciz
  e.img.onerror=()=>{e.ok=false;};
  e.img.src="assets/bg/"+key+".jpg";
  return null;
}
/* Gorseli ekrani kaplayacak sekilde (cover) ciz */
function drawCover(b,img,W,H){
  const ir=img.width/img.height, cr=W/H;
  let dw,dh;
  if(ir>cr){dh=H;dw=H*ir;}else{dw=W;dh=W/ir;}
  b.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
}
/* ================= DUNYA ARKA PLANLARI (prosedurel, asset yok) =================
   Her tema kendi sahnesini bgCv'ye BIR KEZ cizer -> her karede maliyet yok.
   Deterministik: ayni tema hep ayni sahne (rastgele titremez).            */
function bgRand(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};}
function hexA(hex,al){
  const h=hex.replace("#","");
  const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return "rgba("+r+","+g+","+b+","+al+")";
}
function drawScene(b,W,H){
  const key=mem.theme, acc=(T.pal&&T.pal[0])||T.text, acc2=(T.pal&&T.pal[2])||acc;
  const R=bgRand(key.length*7919+W);
  b.save();
  // ortak: ust yumusak isik halesi (derinlik)
  const g=b.createRadialGradient(W*.5,H*.3,0,W*.5,H*.3,Math.max(W,H)*.75);
  g.addColorStop(0,hexA(acc,.10));g.addColorStop(1,"rgba(0,0,0,0)");
  b.fillStyle=g;b.fillRect(0,0,W,H);

  const stars=(n,mx)=>{for(let i=0;i<n;i++){const x=R()*W,y=R()*H,r=(.4+R()*mx)*DPR;
    b.globalAlpha=.10+R()*.35;b.fillStyle=R()<.3?acc2:"#FFFFFF";
    b.beginPath();b.arc(x,y,r,0,7);b.fill();}b.globalAlpha=1;};
  const spires=(cnt,minH,maxH,col,up)=>{for(let i=0;i<cnt;i++){
    const x=R()*W,w=(18+R()*46)*DPR,h=(minH+R()*(maxH-minH))*H;
    b.globalAlpha=.13+R()*.16;b.fillStyle=col;
    b.beginPath();
    if(up){b.moveTo(x,H);b.lineTo(x+w/2,H-h);b.lineTo(x+w,H);}
    else{b.moveTo(x,0);b.lineTo(x+w/2,h);b.lineTo(x+w,0);}
    b.closePath();b.fill();}b.globalAlpha=1;};
  const city=()=>{for(let i=0;i<26;i++){
    const w=(26+R()*54)*DPR,x=R()*W,h=(.12+R()*.32)*H;
    b.globalAlpha=.16;b.fillStyle="#000000";b.fillRect(x,H-h,w,h);
    b.globalAlpha=.30+R()*.35;b.fillStyle=R()<.5?acc:acc2;
    b.fillRect(x,H-h,w,2*DPR);                       // cati neon seridi
    for(let k=0;k<5;k++){const wy=H-h+(8+k*16)*DPR;   // pencere isiklari
      if(wy>H-6*DPR)break;b.globalAlpha=.10+R()*.25;
      b.fillRect(x+(4+R()*(w-10)),wy,3*DPR,3*DPR);}}b.globalAlpha=1;};
  const blobs=(n,col,mn,mx)=>{for(let i=0;i<n;i++){
    const x=R()*W,y=R()*H,r=(mn+R()*(mx-mn))*DPR;
    const gg=b.createRadialGradient(x,y,0,x,y,r);
    gg.addColorStop(0,hexA(col,.20));gg.addColorStop(1,"rgba(0,0,0,0)");
    b.fillStyle=gg;b.beginPath();b.arc(x,y,r,0,7);b.fill();}};
  const bolts=(n)=>{for(let i=0;i<n;i++){
    let x=R()*W,y=0;b.globalAlpha=.10+R()*.14;b.strokeStyle=acc;b.lineWidth=(1+R()*2)*DPR;
    b.beginPath();b.moveTo(x,y);
    while(y<H*(.4+R()*.5)){y+=(20+R()*40)*DPR;x+=(R()-.5)*70*DPR;b.lineTo(x,y);}
    b.stroke();}b.globalAlpha=1;};
  const gears=(n)=>{for(let i=0;i<n;i++){
    const x=R()*W,y=R()*H,rr=(30+R()*70)*DPR,teeth=8+Math.floor(R()*6);
    b.globalAlpha=.09;b.strokeStyle=acc;b.lineWidth=3*DPR;
    b.beginPath();b.arc(x,y,rr,0,7);b.stroke();
    b.beginPath();b.arc(x,y,rr*.55,0,7);b.stroke();
    for(let t=0;t<teeth;t++){const a=t/teeth*6.283;
      b.beginPath();b.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);
      b.lineTo(x+Math.cos(a)*rr*1.2,y+Math.sin(a)*rr*1.2);b.stroke();}}b.globalAlpha=1;};
  const rings=(n)=>{for(let i=0;i<n;i++){
    const x=R()*W,y=R()*H*.7,rr=(60+R()*150)*DPR;
    b.globalAlpha=.07+R()*.06;b.strokeStyle=R()<.5?acc:acc2;b.lineWidth=(2+R()*3)*DPR;
    b.save();b.translate(x,y);b.rotate(R()*3);b.scale(1,.32);
    b.beginPath();b.arc(0,0,rr,0,7);b.stroke();b.restore();}b.globalAlpha=1;};
  const columns=()=>{for(let i=0;i<7;i++){
    const x=(i/7)*W+R()*40*DPR,w=(22+R()*20)*DPR,h=(.3+R()*.45)*H;
    b.globalAlpha=.12;b.fillStyle=acc;
    b.fillRect(x,H-h,w,h);
    b.globalAlpha=.16;b.fillRect(x-4*DPR,H-h,w+8*DPR,10*DPR);}b.globalAlpha=1;};
  const bubbles=(n)=>{for(let i=0;i<n;i++){
    const x=R()*W,y=R()*H,rr=(4+R()*26)*DPR;
    b.globalAlpha=.06+R()*.10;b.strokeStyle=acc2;b.lineWidth=1.5*DPR;
    b.beginPath();b.arc(x,y,rr,0,7);b.stroke();}b.globalAlpha=1;};

  switch(key){
    case "ancient": columns(); stars(40,1.1); break;
    case "void_":   stars(150,1.6); blobs(4,acc,140,300); break;
    case "frozen":  spires(11,.18,.5,acc,true); spires(7,.12,.36,acc2,false); stars(50,1.1); break;
    case "magma":   blobs(7,acc,110,260); spires(8,.10,.34,acc,true); stars(26,1.0); break;
    case "bio":     blobs(9,acc2,70,190); bubbles(26); break;
    case "cyber":   city(); stars(40,1.0); break;
    case "thunder": bolts(7); stars(60,1.2); break;
    case "temple":  columns(); blobs(3,acc,150,280); stars(30,1.0); break;
    case "abyss":   bubbles(40); blobs(5,acc2,120,260); break;
    case "cosmic":  stars(130,1.5); rings(4); blobs(3,acc2,130,280); break;
    case "steam":   gears(6); blobs(3,acc,110,220); break;
    case "dark":    spires(9,.22,.55,"#000000",true); stars(70,1.2); blobs(3,acc,120,240); break;
    case "crystal": spires(13,.16,.48,acc,true); spires(9,.12,.34,acc2,false); stars(45,1.2); break;
    case "metro":   city(); bolts(3); stars(35,1.0); break;
    case "solar":   blobs(6,acc,150,320); rings(3); stars(45,1.3); break;
    default:        stars(60,1.2);
  }
  // alt karartma -> butonlar okunakli kalsin
  const gb=b.createLinearGradient(0,H*.72,0,H);
  gb.addColorStop(0,"rgba(0,0,0,0)");gb.addColorStop(1,hexA(T.bg,.85));
  b.fillStyle=gb;b.fillRect(0,H*.72,W,H*.28);
  b.restore();
}
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  const r=cv.getBoundingClientRect();
  cv.width=r.width*DPR;cv.height=r.height*DPR;
  if(!L)return;
  const pad=12*DPR;
  cell=Math.min((cv.width-pad*2)/L.cols,(cv.height-pad*2)/L.rows);
  ox=(cv.width-cell*L.cols)/2;oy=(cv.height-cell*L.rows)/2;
  bgCv=document.createElement("canvas");
  bgCv.width=cv.width;bgCv.height=cv.height;
  const b=bgCv.getContext("2d");
  try{
    const bi=bgImageFor(mem.theme);
    if(bi){
      drawCover(b,bi,bgCv.width,bgCv.height);
      // okunabilirlik: hafif karartma + alt gradyan
      b.fillStyle=hexA(T.bg,.42);b.fillRect(0,0,bgCv.width,bgCv.height);
      const gb=b.createLinearGradient(0,bgCv.height*.68,0,bgCv.height);
      gb.addColorStop(0,"rgba(0,0,0,0)");gb.addColorStop(1,hexA(T.bg,.9));
      b.fillStyle=gb;b.fillRect(0,bgCv.height*.68,bgCv.width,bgCv.height*.32);
    }else{
      drawScene(b,bgCv.width,bgCv.height);   // gorsel yoksa prosedurel sahne
    }
  }catch(e){}
  b.fillStyle=T.dot;
  const mk=(x,y)=>!L.mask||L.mask(Math.max(0,Math.min(L.cols-1,x)),Math.max(0,Math.min(L.rows-1,y)));
  for(let i=0;i<=L.cols;i++)for(let j=0;j<=L.rows;j++){
    if(!(mk(i,j)||mk(i-1,j)||mk(i,j-1)||mk(i-1,j-1)))continue;
    b.beginPath();b.arc(ox+i*cell,oy+j*cell,1.1*DPR,0,7);b.fill();
  }
  stCv=document.createElement("canvas");
  stCv.width=cv.width;stCv.height=cv.height;
  stDirty=true;
}

/* ---- gizli sure bonuslari ----
   Her bolumde birkac ok gizlice +sure tasir. Gorunumu normal okla
   ayni; oyuncu o oku cozdugunde sure artar + "+3sn" floater akar. */
function assignTimeBonuses(){
  if(!L||!L.snakes)return;
  L.snakes.forEach(s=>{s.timeBonus=0;});
  const n=L.snakes.length;
  // ok sayisina gore 1-4 adet bonus dagit (kucuk bolumde az, buyukte cok)
  let cnt=Math.max(1,Math.min(4,Math.round(n/6)));
  const pool=L.snakes.map((s,i)=>i);
  // Fisher-Yates karistir
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const AMT=[3,4,5];
  for(let k=0;k<cnt&&k<pool.length;k++){
    L.snakes[pool[k]].timeBonus=AMT[Math.floor(Math.random()*AMT.length)];
  }
}

/* ---- mekanik ---- */
function blockerOf(s){
  let x=s.head[0]+DIRS[s.dir][0],y=s.head[1]+DIRS[s.dir][1];
  while(x>=0&&x<L.cols&&y>=0&&y<L.rows){
    for(const o of L.snakes){
      if(o.alive&&o.id!==s.id&&o.cells.some(c=>c[0]===x&&c[1]===y))return {o,x,y};
    }
    x+=DIRS[s.dir][0];y+=DIRS[s.dir][1];
  }
  return null;
}
function buildTrack(s){ // kuyruk->kafa + kenar dışına uzatma
  const pts=s.cells.map(c=>[ox+c[0]*cell+cell/2,oy+c[1]*cell+cell/2]);
  const [dx,dy]=DIRS[s.dir];
  let hx=s.head[0],hy=s.head[1];
  const ext=Math.max(L.cols,L.rows)+s.cells.length+2;
  for(let i=1;i<=ext;i++)
    pts.push([ox+(hx+dx*i)*cell+cell/2,oy+(hy+dy*i)*cell+cell/2]);
  return pts;
}
function snakeNear(px,py){
  let best=null,bd=1e9;
  for(const o of L.snakes){
    if(!o.alive)continue;
    for(const c of o.cells){
      const dx=ox+c[0]*cell+cell/2-px,dy=oy+c[1]*cell+cell/2-py;
      const d=dx*dx+dy*dy;
      if(d<bd){bd=d;best=o;}
    }
  }
  return bd<=(cell*1.25)*(cell*1.25)?best:null;
}
function tapSnake(s){
  if(locked||paused||!L||!s)return;
  hintId=-1;
  const blk=blockerOf(s);
  if(!blk){
    s.alive=false;
    const now=Date.now();
    combo=(now-lastClear<3000)?combo+1:1;
    lastClear=now;
    sfx.fly();
    haptic("ok");
    const pts=10*combo;levelScore+=pts;
    floaters.push({x:ox+s.head[0]*cell+cell/2,y:oy+s.head[1]*cell+cell/2,
      txt:combo>1?"x"+combo:"+"+pts,c:colName(s),t:0});
    // Gizli sure bonusu: bu ok +sure tasiyorsa sureyi artir
    if(s.timeBonus>0&&!timeUp&&hearts>0){
      timeLeft+=s.timeBonus;
      floaters.push({x:ox+s.head[0]*cell+cell/2,y:oy+s.head[1]*cell+cell/2-cell*.9,
        txt:"+"+s.timeBonus+TX.sn,c:"#5FD68A",t:-.12});
      pluck(1046,.2);
      if(navigator.vibrate)navigator.vibrate([15,30,15]);
      s.timeBonus=0;
    }
    levelRemain--;
    // combo arttikca daha guclu patlama (madde 11: gorsel combo geri bildirimi)
    const burst=Math.min(6+combo*2,12);
    for(let i=0;i<burst;i++){
      particles.push({x:ox+s.head[0]*cell+cell/2,y:oy+s.head[1]*cell+cell/2,
        vx:(Math.random()-.5)*7*DPR,vy:(Math.random()-.7)*6*DPR,
        t:.6,c:colName(s),s:(1.5+Math.random()*2)*DPR});
    }
    updateProg();
    const track=buildTrack(s);
    const travel=track.length-s.cells.length;
    anims.push({type:"fly",s,track,t:0,dur:Math.min(travel/58+.05,.62),travel});
    if(!L.snakes.some(o=>o.alive)){locked=true;setTimeout(winLevel,500);}
  }else{
    combo=0;shakeT=.25;
    $("hearts").classList.add("flash");
    setTimeout(()=>$("hearts").classList.remove("flash"),420);
    sfx.bump();
    haptic("err");
    const gap=Math.abs(blk.x-s.head[0])+Math.abs(blk.y-s.head[1])-1;
    anims.push({type:"bump",s,track:buildTrack(s),t:0,dur:.5,gap:gap+.35});
    hearts--;updateHearts();
    if(hearts<=0){locked=true;setTimeout(()=>{sfx.fail();$("failT").textContent=TX.failT;$("reviveBtn").textContent=TX.revive;$("reviveBtn").dataset.mode="";$("reviveBtn").style.display="";updateCoinRevive();guncelleReklamButonlari();$("failOv").classList.remove("hide");
      setTimeout(()=>{if(!nextCache)nextCache={n:mem.level,L:genLevel(mem.level)};},700);},550);}
  }
}
function winLevel(){
  sfx.win();
  for(let i=0;i<70;i++){
    particles.push({x:cv.width/2,y:cv.height/2.4,
      vx:(Math.random()-.5)*14*DPR,vy:(Math.random()-1.1)*11*DPR,
      t:0,c:T.mono?(i%3?T.mono:"#FFB347"):PALETTE[i%PALETTE.length],s:(2+Math.random()*3)*DPR});
  }
  const lost=maxH-hearts;
  const stars=lost===0?3:(lost<=Math.ceil(maxH*.4)?2:1);
  if(lost===0)levelScore+=100;
  mem.total=(mem.total||0)+levelScore;
  const reward=5+stars*3;   // dengelendi: altin artik bol degil
  mem.coins=(mem.coins|0)+reward;
  const sec=Math.round((Date.now()-levelStart)/1000);
  // ipucusuz seri
  if(hintUsed)mem.noHintRun=0; else mem.noHintRun=(mem.noHintRun|0)+1;
  // en iyi skor kaydi
  const bk=String(mem.level), prev=mem.best[bk];
  const isBest=!prev||levelScore>prev.sc;
  if(isBest)mem.best[bk]={s:stars,sc:levelScore,t:sec};
  // her 3 seviyede 1 ipucu hediyesi
  const hintGift=0;   // seviye basi bedava ipucu YOK (ipucu: reklam / altin / sandik)
  save();updateCoin();
  haptic("win");
  // ekrani doldur
  $("vScore").textContent=levelScore;
  $("vTime").textContent=sec+TX.sn;
  $("vBest").textContent=prev?(prev.sc+(isBest?" ✨":"")):(LANG==="tr"?"YENİ!":"NEW!");
  $("rwCoinV").textContent="+"+reward;
  $("rwHintV").textContent="+"+hintGift;
  $("rwHint").style.display=hintGift?"":"none";
  $("rwCoin").classList.remove("on");$("rwHint").classList.remove("on");
  checkAchs({stars,sec,combo});
  ["st1","st2","st3"].forEach(id=>$(id).classList.remove("on"));
  setTimeout(()=>{
    $("winOv").classList.remove("hide");
    for(let i=0;i<stars;i++)
      setTimeout(()=>{$("st"+(i+1)).classList.add("on");sfx.tick();},250+i*280);
    setTimeout(()=>{$("rwCoin").classList.add("on");sfx.tick();},250+stars*280);
    setTimeout(()=>{$("rwHint").classList.add("on");},420+stars*280);
    setTimeout(()=>{const nn=mem.level+1;
      if(!nextCache)nextCache={n:nn,L:genLevel(nn)};},1200);
  },850);
}

function clampView(){
  view.tx=Math.min(0,Math.max(cv.width*(1-view.s),view.tx));
  view.ty=Math.min(0,Math.max(cv.height*(1-view.s),view.ty));
}
function zoomAt(mx,my,f){
  const ns=Math.min(3,Math.max(1,view.s*f));
  const wx=(mx-view.tx)/view.s,wy=(my-view.ty)/view.s;
  view.s=ns;view.tx=mx-wx*ns;view.ty=my-wy*ns;clampView();
}

/* ---- çizim ---- */
function trackPoint(track,f){
  const i=Math.floor(f),r=f-i;
  const a=track[Math.min(i,track.length-1)],b=track[Math.min(i+1,track.length-1)];
  return [a[0]+(b[0]-a[0])*r,a[1]+(b[1]-a[1])*r];
}
/* Renk tonlama: 3B tup gorunumu icin acik/koyu varyantlar */
function shade(hex,amt){
  const h=hex.replace("#","");
  if(h.length<6)return hex;
  let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  if(amt>0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt;}
  else{r*=(1+amt);g*=(1+amt);b*=(1+amt);}
  const c=v=>("0"+Math.max(0,Math.min(255,Math.round(v))).toString(16)).slice(-2);
  return "#"+c(r)+c(g)+c(b);
}
function drawSnakePts(pts,color,alpha,glow,ws=1){
  if(pts.length<2)return;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.lineCap="round";ctx.lineJoin="round";
  const path=()=>{ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(const p of pts)ctx.lineTo(p[0],p[1]);};
  if(glow){
    ctx.save();
    ctx.globalAlpha=(typeof glow==="number"?glow:1);
    ctx.strokeStyle="#FFB347";ctx.lineWidth=cell*.75;
    ctx.shadowColor="#FFB347";ctx.shadowBlur=cell*1.2;
    path();ctx.stroke();ctx.restore();
  }
  // dış hat (zemin rengi) -> iç içe geçen yollar ayrışsın
  ctx.strokeStyle=T.outline;ctx.lineWidth=cell*.5*ws;
  path();ctx.stroke();
  // NEON: shadowBlur PAHALI -> yerine kalin yari saydam katmanlar (cok daha hizli)
  if(NEONFX){
    ctx.save();
    ctx.strokeStyle=color;
    ctx.globalAlpha=alpha*.13; ctx.lineWidth=cell*.72*ws; path();ctx.stroke();
    ctx.globalAlpha=alpha*.22; ctx.lineWidth=cell*.52*ws; path();ctx.stroke();
    ctx.restore();
  }
  /* --- 3B TUP GOVDE: koyu taban -> ana renk -> ust isik -> parlama cizgisi --- */
  if(NEONFX){
    // 1) koyu taban (hacim/govde alt kismi)
    ctx.strokeStyle=shade(color,-0.45);ctx.lineWidth=cell*.34*ws;
    path();ctx.stroke();
    // 2) ana renk, biraz daha ince -> alt kenarda koyu serit kalir
    ctx.strokeStyle=color;ctx.lineWidth=cell*.27*ws;
    path();ctx.stroke();
    // 3) ust yari: acik ton (silindir isigi)
    ctx.save();ctx.globalAlpha=alpha*.85;
    ctx.strokeStyle=shade(color,0.42);ctx.lineWidth=cell*.16*ws;
    path();ctx.stroke();ctx.restore();
    // 4) en ustte ince beyaz parlama (cam yansimasi)
    ctx.save();ctx.globalAlpha=alpha*.75;
    ctx.strokeStyle=shade(color,0.85);ctx.lineWidth=cell*.07*ws;
    path();ctx.stroke();ctx.restore();
  }else{
    ctx.strokeStyle=color;ctx.lineWidth=cell*.32*ws;
    path();ctx.stroke();
  }
  ctx.shadowBlur=0;
  // kuyruk noktası
  ctx.fillStyle=T.outline;
  ctx.beginPath();ctx.arc(pts[0][0],pts[0][1],cell*.065,0,7);ctx.fill();
  // kafa (ok ucu)
  const n=pts.length,h=pts[n-1],p2=pts[n-2];
  const ang=Math.atan2(h[1]-p2[1],h[0]-p2[0]);
  ctx.translate(h[0],h[1]);ctx.rotate(ang);
  // ok ucu: koyu taban + ana renk + ust isik (govdeyle ayni hacim dili)
  const tri=(k,col)=>{
    ctx.fillStyle=col;ctx.beginPath();
    ctx.moveTo(cell*.38*ws*k,0);
    ctx.lineTo(-cell*.05*ws*k,-cell*.23*ws*k);
    ctx.lineTo(-cell*.05*ws*k,cell*.23*ws*k);
    ctx.closePath();ctx.fill();
  };
  if(NEONFX){
    tri(1.0,shade(color,-0.45));
    tri(0.86,color);
    ctx.save();ctx.globalAlpha=alpha*.8;
    ctx.translate(0,-cell*.045*ws);
    tri(0.52,shade(color,0.5));
    ctx.restore();
  }else{
    tri(1.0,color);
  }
  ctx.restore();
}
let last=0;
function frame(ts){

      r:(0.6+Math.random()*1.5)*DPR,sp:(4+Math.random()*11)*DPR,ph:Math.random()*6.28,

    const a=0.05+0.04*Math.sin(ts/700+p.ph);

    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }

  const liveMode=anims.length>0||hintId>=0||lastFew||(ts-lvlT)<1000;
  if(!liveMode&&stCv){
    /* sakin an: 200+ yılanı tek resimden bas (performans) */
    if(stDirty){
      const sc=stCv.getContext("2d");
      sc.clearRect(0,0,stCv.width,stCv.height);
      if(bgCv)sc.drawImage(bgCv,0,0);
      const keep=ctx;ctx=sc;FAST=false;   // cache tam detayla cizilir
      for(const s of L.snakes){
        if(!s.alive)continue;
        drawSnakePts(s.cells.map(c=>[ox+c[0]*cell+cell/2,oy+c[1]*cell+cell/2]),colName(s),1,false);
      }
      ctx=keep;stDirty=false;
    }

  }else{
    stDirty=true;
    // ANIMASYON ANI: yogun seviyelerde 3B katmanlari atla (akicilik > detay)
    FAST=(L.snakes.length>70);
    if(bgCv)ctx.drawImage(bgCv,0,0);
    let hinted=null;
    for(const s of L.snakes){
      if(!s.alive&&!animIds.has(s.id))continue;
      if(animIds.has(s.id))continue;
      if(s.id===hintId){hinted=s;continue;}
      const age=ts-lvlT-s.delay;
      if(age<0)continue;
      const ap=Math.min(age/240,1);
      const ws=ap<1?(.4+.75*easeOut(ap)-.15*easeOut(ap)*easeOut(ap)):1;
      const gl=lastFew?(.22+.14*Math.sin(ts/160)):false;
      drawSnakePts(s.cells.map(c=>[ox+c[0]*cell+cell/2,oy+c[1]*cell+cell/2]),
        colName(s),(hintId>=0?.2:1)*easeOut(ap),gl,ws);
    }
    if(hinted){
      const pulse=.7+.3*Math.sin(ts/110);
      drawSnakePts(hinted.cells.map(c=>[ox+c[0]*cell+cell/2,oy+c[1]*cell+cell/2]),colName(hinted),1,pulse);
    }
  }
  // animasyonlar
  for(let i=anims.length-1;i>=0;i--){
    const an=anims[i];an.t+=dt;
    const p=Math.min(an.t/an.dur,1);
    const bl=an.s.cells.length;

      off=(p<.18?easeInQ(p/.18)*.18:p)*an.travel;
      const pts=[];

      drawSnakePts(pts,colName(an.s),1-p*.25,false);
    }else{
      if(p<.5)off=easeOut(p*2)*an.gap;

      const pts=[];

      drawSnakePts(pts,colName(an.s),1,false);
    }
    if(p>=1)anims.splice(i,1);
  }
  // yüzen skor yazıları
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];f.t+=dt;
    const dur=f.big?1.5:.9;
    if(f.t>dur){floaters.splice(i,1);continue;}
    if(f.t<0)continue;
    const p2=f.t/dur;
    ctx.save();
    ctx.globalAlpha=Math.min(1,(1-p2)*2.2)*(f.big?.95:1);
    ctx.fillStyle=f.c;
    let fs=f.big?38*DPR:cell*1.7;
    ctx.font="900 "+fs+"px system-ui";
    // Ekrandan tasmasin: genislige gore fontu kucult (dar telefonlar / uzun metin)
    const enFazla=cv.width*0.92;
    let gen=ctx.measureText(f.txt).width;
    if(gen>enFazla){
      fs=Math.max(11*DPR,fs*enFazla/gen);
      ctx.font="900 "+fs+"px system-ui";
    }
    ctx.textAlign="center";
    if(f.big){ctx.shadowColor=T.bg;ctx.shadowBlur=16*DPR;}
    ctx.fillText(f.txt,Math.max(cv.width/2,f.x*0+cv.width/2),f.y-p2*cell*(f.big?1.2:2));
    ctx.restore();
  }
  // konfeti
  for(let i=particles.length-1;i>=0;i--){
    const pt=particles[i];pt.t+=dt;
    if(pt.t>1.4){particles.splice(i,1);continue;}
    pt.vy+=22*DPR*dt;pt.x+=pt.vx;pt.y+=pt.vy;
    ctx.globalAlpha=Math.max(0,1-pt.t/1.4);
    ctx.fillStyle=pt.c;ctx.fillRect(pt.x,pt.y,pt.s,pt.s);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

let fw=[];            // havai fisek parcaciklari
const FW_COL=["#FFD34D","#FF5E7A","#5FD8FF","#8AFF9E","#C77DFF","#FFA13D"];
function fireworkAt(x,y,n,pow){
  const c=FW_COL[Math.floor(Math.random()*FW_COL.length)];
  for(let i=0;i<n;i++){
    const a=(i/n)*6.283+Math.random()*.3, sp=(1+Math.random())*pow;
    fw.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:1,c:Math.random()<.25?"#FFFFFF":c,
      s:(1.4+Math.random()*2.2)*DPR});
  }
}
function fireworkShow(count){
  let i=0;
  const shoot=()=>{
    if(i++>=count)return;
    fireworkAt(cv.width*(.18+Math.random()*.64), cv.height*(.16+Math.random()*.34),
               26+Math.floor(Math.random()*16), (5+Math.random()*3)*DPR);
    sfx.tick();
    setTimeout(shoot, 260+Math.random()*260);
  };
  shoot();
}
function drawFw(dt){
  if(!fw.length)return;
  ctx.save();
  for(let i=fw.length-1;i>=0;i--){
    const p=fw[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.16*DPR; p.vx*=0.985; p.vy*=0.985;
    p.t-=dt*0.65;
    if(p.t<=0){fw.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.t);
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.s*p.t,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.restore();
}

/* ================= SEVIYE PATIKASI (Candy Crush tarzi) ================= */
function worldOfLevel(n){
  let best=null,bestLv=-1;
  THEME_ORDER.forEach(function(k){
    const u=THEME_UNLOCK[k];
    if(u<9999&&u<=n&&u>bestLv){bestLv=u;best=k;}
  });
  return best||"ancient";
}
function renderLevels(){
  const wrap=$("lvlPath"); if(!wrap)return;
  wrap.innerHTML="";
  const maxL=Math.max(1,mem.maxLevel||1);
  const son=Math.max(24,Math.ceil((maxL+8)/6)*6);
  const W=wrap.clientWidth||window.innerWidth;
  const GAP=104;                       // dugumler arasi dikey mesafe
  const PADTOP=90, PADBOT=120;
  const H=PADTOP+son*GAP+PADBOT;
  wrap.style.height=H+"px";

  // Dugum konumlari: yilan gibi kivrilan patika (sinus)
  const pos=[];
  for(let n=1;n<=son;n++){
    const t=(son-n);                                   // asagidan yukari: 1 en altta
    const y=PADTOP+t*GAP;
    const x=W/2+Math.sin(n*0.85)*(W*0.27);
    pos.push({n,x,y});
  }

  // --- dunya bantlari: her dunyanin y araligini bul ---
  const bands={};
  pos.forEach(function(p){
    const k=worldOfLevel(p.n);
    if(!bands[k])bands[k]={min:p.y,max:p.y};
    else{bands[k].min=Math.min(bands[k].min,p.y);bands[k].max=Math.max(bands[k].max,p.y);}
  });
  Object.keys(bands).forEach(function(k){
    const b=bands[k];
    const top=Math.max(0,b.min-GAP*0.6), bot=Math.min(H,b.max+GAP*0.6);
    const band=document.createElement("div");
    band.className="wband";
    band.style.top=top+"px";
    band.style.height=(bot-top)+"px";
    band.style.backgroundImage='url("assets/bg/'+k+'.jpg")';
    wrap.appendChild(band);
    const lab=document.createElement("div");
    lab.className="wlabel";
    lab.style.top=(top+10)+"px";
    lab.textContent=THEMES[k]?THEMES[k].name:"";
    wrap.appendChild(lab);
  });

  // --- patika cizgisi (SVG) ---
  const ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("width",W);svg.setAttribute("height",H);
  svg.style.cssText="position:absolute;left:0;top:0;z-index:2;pointer-events:none";
  let d="M "+pos[0].x+" "+pos[0].y;
  for(let i=1;i<pos.length;i++){
    const a=pos[i-1],b=pos[i];
    const my=(a.y+b.y)/2;
    d+=" C "+a.x+" "+my+", "+b.x+" "+my+", "+b.x+" "+b.y;
  }
  const mk=(w,col,dash)=>{
    const q=document.createElementNS(ns,"path");
    q.setAttribute("d",d);q.setAttribute("fill","none");
    q.setAttribute("stroke",col);q.setAttribute("stroke-width",w);
    q.setAttribute("stroke-linecap","round");
    if(dash)q.setAttribute("stroke-dasharray",dash);
    svg.appendChild(q);
  };
  mk(16,"rgba(0,0,0,.45)");            // golge
  mk(11,"rgba(150,200,255,.30)");      // govde
  mk(3,"rgba(220,240,255,.55)","2 12");// noktali orta cizgi
  wrap.appendChild(svg);

  // --- dugumler ---
  pos.forEach(function(p){
    const n=p.n, b=mem.best[String(n)], kilitli=n>maxL, mevcut=(n===maxL);
    const el=document.createElement("div");
    el.className="lnode"+(kilitli?" lock":(mevcut?" cur":(b?" done":"")));
    el.style.left=p.x+"px";el.style.top=p.y+"px";
    el.innerHTML=(mevcut?'<span class="curTag">'+(LANG==="tr"?"BURADASIN":"YOU ARE HERE")+'</span>':'')
      +"<span>"+(kilitli?"🔒":n)+"</span>"
      +(b?'<span class="nstars">'+"★".repeat(b.s)+"☆".repeat(3-b.s)+'</span>':'');
    if(!kilitli){
      el.onclick=function(){
        $("lvlOv").classList.add("hide");
        $("startOv").classList.add("hide");
        sfx.tick();haptic("tap");startLevel(n);
      };
    }
    wrap.appendChild(el);
  });

  // mevcut seviyeye kaydir
  setTimeout(function(){
    const sc=$("lvlScroll"),c=wrap.querySelector(".lnode.cur");
    if(sc&&c)sc.scrollTop=Math.max(0,c.offsetTop-sc.clientHeight*0.62);
  },30);
}
function openLevels(){$("lvlOv").classList.remove("hide");renderLevels();}
$("mLvlBtn").onclick=function(){openLevels();sfx.tick();};
$("lvlClose").onclick=function(){$("lvlOv").classList.add("hide");sfx.tick();};

/* ============ CEVRIMDISI ALGILAMA ============
   Oyun offline calisir (rakipler gibi) ama REKLAM ODULLERI verilmez:
   internet yokken bedava ipucu/can sömürülemez.                      */
let ONLINE=(typeof navigator.onLine==="boolean")?navigator.onLine:true;
function agGuncelle(){
  const yeni=(typeof navigator.onLine==="boolean")?navigator.onLine:true;
  const degisti=(yeni!==ONLINE);
  ONLINE=yeni;
  const rozet=$("offBadge");
  if(rozet)rozet.style.display=ONLINE?"none":"";
  // acik ekranlari tazele
  const sh=$("shopOv");
  if(sh&&!sh.classList.contains("hide"))renderShop();
  guncelleReklamButonlari();
  if(degisti&&!ONLINE){
    try{floaters.push({x:cv.width/2,y:cv.height*.3,
      txt:(LANG==="tr"?"Çevrimdışı — ödüller kapalı":"Offline — rewards disabled"),
      c:"#FFB347",t:-.1,big:false});}catch(e){}
  }
}
function guncelleReklamButonlari(){
  // Can/sure icin reklam butonu
  const rb=$("reviveBtn");
  if(rb){
    rb.disabled=!ONLINE;
    rb.style.opacity=ONLINE?"1":".4";
    if(!ONLINE)rb.textContent=(LANG==="tr"?"📶 İnternet gerekli":"📶 Internet required");
    else rb.textContent=TX.revive;
  }
  // Sandik 2x
  const dx=$("chestX2");
  if(dx&&dx.style.display!=="none"){
    dx.disabled=!ONLINE;
    dx.style.opacity=ONLINE?"1":".4";
  }
}
window.addEventListener("online",agGuncelle);
window.addEventListener("offline",agGuncelle);
document.addEventListener("visibilitychange",function(){if(!document.hidden)agGuncelle();});
setTimeout(agGuncelle,300);
</script>
